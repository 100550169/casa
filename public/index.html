<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#fff5e9" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>Casa · tareas en familia</title>
<meta name="description" content="Organiza las tareas del hogar en familia: tareas fijas y adicionales, paga, niveles y menús semanales." />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" type="image/png" sizes="192x192" href="/iconos/icono-192.png" />
<!-- iOS ("Añadir a pantalla de inicio"). Los iconos deben ser OPACOS y sin
     esquinas redondeadas: iOS aplica su propia máscara, y si el PNG tiene
     transparencia la compone sobre negro o descarta el icono. Se declaran
     varios tamaños porque iOS elige el que mejor encaje en cada dispositivo. -->
<link rel="apple-touch-icon" sizes="180x180" href="/iconos/apple-touch-icon.png" />
<link rel="apple-touch-icon" sizes="167x167" href="/iconos/apple-touch-icon-167.png" />
<link rel="apple-touch-icon" sizes="152x152" href="/iconos/apple-touch-icon-152.png" />
<link rel="apple-touch-icon" sizes="120x120" href="/iconos/apple-touch-icon-120.png" />
<link rel="apple-touch-icon-precomposed" href="/iconos/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-title" content="Casa" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
<style>
:root{
  /* ----- Paleta cálida "hogar soleado" ----- */
  --bg:#fef6ea;          /* crema papel */
  --bg2:#f5ead8;         /* crema más cálido (inputs, tracks) */
  --card:#ffffff;        /* tarjetas blancas */
  --card2:#fdf3e6;       /* relleno suave */
  --line:#efe1cc;        /* líneas cálidas */
  --text:#43352a;        /* marrón cálido oscuro */
  /* Contraste (oct 2026): los textos tienen que leerse a 4,5:1 sobre las
     tarjetas y el fondo (norma WCAG AA). Antes --dim daba 3,1:1 y --faint
     2:1: en un móvil al sol no se leían las etiquetas de la barra inferior. */
  --dim:#766859;         /* texto secundario — 5,0:1 sobre el fondo */
  --faint:#998d7e;       /* pistas y detalles — 3:1, solo para lo no esencial */

  --accent:#ff7a59;      /* coral alegre: fondos, bordes y marca */
  --accent-text:#b4563f; /* el coral cuando es LETRA: 4,8:1 sobre blanco */
  --accent-ink:#43352a;  /* letra SOBRE coral: 4,6:1 (el blanco daba 2,6:1) */
  --sun:#ffc24b;         /* amarillo sol (solo decorativo) */
  /* Un tono más oscuros que los originales para que valgan a la vez como
     letra sobre claro y como fondo con letra blanca (casillas, contadores). */
  --green:#217b51;       /* verde hoja */
  --amber:#9e5f20;       /* mandarina tostada */
  --red:#b14343;         /* rojo */
  --cyan:#217194;        /* azul */
  --violet:#715aae;      /* uva */

  --shadow:0 8px 22px rgba(180,120,70,.10), 0 2px 6px rgba(180,120,70,.06);
  --shadow-lg:0 14px 40px rgba(180,120,70,.16);
  --r:20px;
  --num:"Fredoka",ui-rounded,system-ui,sans-serif;
  font-family:"Nunito",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);min-height:100vh}
body{
  background-image:
    radial-gradient(520px 320px at 88% -6%, rgba(255,194,75,.22), transparent 60%),
    radial-gradient(460px 300px at -8% 4%, rgba(255,122,89,.14), transparent 60%),
    radial-gradient(600px 400px at 50% 108%, rgba(47,159,208,.10), transparent 60%);
  background-attachment:fixed;
}
h1,h2,h3{margin:0;font-family:var(--num);font-weight:600;letter-spacing:-.01em}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit;font-size:15px;background:var(--bg2);border:1.5px solid var(--line);color:var(--text);border-radius:12px;padding:11px 13px;width:100%;font-weight:600}
input:focus,select:focus{outline:none;border-color:var(--accent);background:#fff}
.num{font-family:var(--num);font-variant-numeric:tabular-nums;font-weight:600}
.dim{color:var(--dim)} .faint{color:var(--faint)}
.screen{animation:rise .4s cubic-bezier(.2,.8,.2,1)}
/* Repintado por sincronización de fondo: nada se vuelve a animar, para que la
   pantalla no parezca refrescarse sola cada pocos segundos. */
.screen.quiet,.screen.quiet *{animation:none!important}
/* Navegando con teclado (o un lector de pantalla) tiene que verse dónde se
   está. Solo con :focus-visible, para no pintar el contorno al tocar. */
:focus-visible{outline:3px solid var(--accent-text);outline-offset:2px;border-radius:10px}
input:focus-visible,select:focus-visible{outline-offset:0}
/* Quien tiene activado "Reducir movimiento" en el sistema no ve animaciones. */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}
/* Contador de pendientes en las pestañas: es el "aviso" de la app, ya que no
   hay notificaciones push. */
.badge-num{display:inline-grid;place-items:center;min-width:19px;height:19px;padding:0 5px;
  border-radius:999px;background:var(--red);color:#fff;font-size:11px;font-weight:800;
  font-family:var(--num);margin-left:auto;flex:none;line-height:1}
.nav .badge-num{position:absolute;top:2px;right:50%;transform:translateX(22px);margin:0}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.8);opacity:0}60%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}

.pill{font-size:11px;padding:5px 11px;border-radius:999px;font-weight:700;display:inline-flex;align-items:center;gap:5px}
.p-pending{background:#f0e7d8;color:#6f6253}
.p-wait{background:#fff0d6;color:var(--amber)}
.p-ok{background:#d9f5e7;color:var(--green)}
.p-late{background:#fde0e0;color:var(--red)}
.p-fixed{background:#d9eefa;color:var(--cyan)}
.p-extra{background:#eae6fb;color:var(--violet)}
.pts{font-family:var(--num);font-weight:700;color:var(--accent-text)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 17px;border-radius:14px;font-weight:800;font-size:14px;background:#fff;border:1.5px solid var(--line);color:var(--text);transition:transform .12s, box-shadow .15s}
.btn:hover{box-shadow:var(--shadow)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);box-shadow:0 6px 16px rgba(255,122,89,.32)}
.btn.primary:hover{box-shadow:0 8px 22px rgba(255,122,89,.42)}
.btn.sm{padding:8px 13px;font-size:13px;border-radius:11px}
.btn.ok{background:#d9f5e7;color:var(--green);border-color:#bfead4}
.btn.ghost{background:transparent;box-shadow:none}
.btn:active{transform:scale(.96)} .btn:disabled{opacity:.45;cursor:default;box-shadow:none}
.btn.w{width:100%}

.card{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.card.glow{background:linear-gradient(160deg,#ffffff,#fff4e2);border-color:#ffe3bb}
.row{display:flex;align-items:center;gap:10px} .spacer{flex:1}
.field{margin-bottom:13px} .field label{font-size:12px;color:var(--dim);display:block;margin-bottom:6px;font-weight:700}
.sect-title{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;font-weight:800;margin:4px 0 10px}
.empty{text-align:center;color:var(--faint);padding:32px 10px;font-size:14px;font-weight:600}
.preview-tag{display:inline-block;font-size:11px;font-weight:800;color:var(--violet);background:#eae6fb;padding:3px 9px;border-radius:7px;margin-left:8px}
.avatar{border-radius:14px;display:grid;place-items:center;font-weight:800;flex:none;font-family:var(--num)}
.progress{height:11px;background:var(--bg2);border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.progress>span{display:block;height:100%;border-radius:999px;transition:width .6s cubic-bezier(.2,.8,.2,1)}

/* ===== Barra de modo (demo) ===== */
.modebar{position:fixed;top:0;left:0;right:0;z-index:50;background:rgba(254,246,234,.86);backdrop-filter:blur(12px);border-bottom:1.5px solid var(--line);display:flex;align-items:center;gap:10px;padding:9px 16px;font-size:13px;font-weight:700}
.modebar .seg{display:flex;background:var(--bg2);border:1.5px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.modebar .seg button{padding:6px 13px;border-radius:9px;font-size:12px;color:var(--dim);font-weight:800}
.modebar .seg button.on{background:var(--accent);color:var(--accent-ink);box-shadow:0 3px 8px rgba(255,122,89,.3)}

/* =========================================================
   ESCRITORIO (padre)
   ========================================================= */
.desk{display:none}
.desk .wrap{max-width:1240px;margin:0 auto;padding:64px 26px 48px;display:grid;grid-template-columns:230px 1fr;gap:26px}
.side{position:sticky;top:64px;align-self:start}
.side .brand{display:flex;align-items:center;gap:11px;margin-bottom:24px;padding:0 4px}
.side .brand .dot{width:46px;height:46px;border-radius:15px;background:linear-gradient(150deg,var(--accent),var(--sun));display:grid;place-items:center;font-size:22px;box-shadow:0 8px 18px rgba(255,122,89,.3);transform:rotate(-4deg)}
.side nav{display:flex;flex-direction:column;gap:5px}
.side nav button{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;color:var(--dim);font-weight:800;font-size:14px;text-align:left;width:100%;transition:.15s}
.side nav button.on{background:#fff;color:var(--text);box-shadow:var(--shadow);border:1.5px solid var(--line)}
.side nav button.on svg{stroke:var(--accent)}
.side nav button:hover:not(.on){color:var(--text);background:rgba(255,255,255,.5)}
.side nav svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.deskmain h2{font-size:27px;margin-bottom:3px}
.deskmain .crumb{color:var(--dim);font-size:14px;margin-bottom:24px;font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:22px}
.kpi{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:17px;box-shadow:var(--shadow);border-top:4px solid var(--accent);animation:rise .4s both}
.kpi:nth-child(1){border-top-color:var(--green)} .kpi:nth-child(2){border-top-color:var(--cyan)}
.kpi:nth-child(3){border-top-color:var(--sun)} .kpi:nth-child(4){border-top-color:var(--violet)}
.kpi:nth-child(2){animation-delay:.05s} .kpi:nth-child(3){animation-delay:.1s} .kpi:nth-child(4){animation-delay:.15s}
.kpi .k{font-size:13px;color:var(--dim);font-weight:700} .kpi .v{font-family:var(--num);font-size:28px;margin-top:6px;font-weight:700} .kpi .v small{font-size:15px;color:var(--dim)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.cols-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);font-weight:800;padding:9px 10px;border-bottom:2px solid var(--line)}
td{padding:12px 10px;border-bottom:1px solid var(--line);font-size:14px;font-weight:600}
tr:last-child td{border-bottom:none}
.bal{display:flex;gap:18px;align-items:flex-end;height:155px;padding-top:10px}
.bal .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:9px;height:100%;justify-content:flex-end}
.bal .bar{width:100%;max-width:56px;border-radius:14px 14px 7px 7px;display:flex;align-items:flex-start;justify-content:center;padding-top:7px;transition:height .6s cubic-bezier(.2,.8,.2,1);box-shadow:inset 0 -6px 12px rgba(0,0,0,.06)}
.bal .bar .v{font-family:var(--num);font-size:13px;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.18)}
.bal .nm{font-size:13px;color:var(--dim);font-weight:700}
.task-line{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.task-line:last-child{border:none}
.tic{width:42px;height:42px;border-radius:13px;background:var(--card2);display:grid;place-items:center;font-size:19px;flex:none;border:1.5px solid var(--line)}
.chip{font-size:11px;padding:4px 10px;border-radius:9px;background:var(--card2);border:1.5px solid var(--line);color:var(--dim);font-weight:700}

/* ----- Calendario (Dashboard) ----- */
.ag-grid{width:100%;min-width:760px;border-collapse:separate;border-spacing:6px;table-layout:fixed}
.ag-grid th{text-align:center;padding:4px 2px;border:none;font-size:12px;color:var(--dim)}
.ag-grid th.hoy{color:var(--accent-text)}
.ag-grid th.ag-fr{width:92px;text-align:left;font-size:13px;color:var(--text);text-transform:none;letter-spacing:0;vertical-align:top;padding-top:10px}
.ag-grid th.ag-fr small{display:block;font-size:11px;color:var(--faint);font-weight:700;margin-top:2px}
.ag-grid td.ag-cell{vertical-align:top;height:96px;padding:6px;border:1.5px solid var(--line);border-radius:14px;background:var(--card2)}
.ag-grid td.ag-cell.hoy{border-color:var(--accent);background:#fff8f1}
/* Tiempo ocupado: rayado, para que se distinga sin depender solo del color. */
.ag-cell.ocupada,.ag-pick.ocupada{background:repeating-linear-gradient(135deg,#f5ead8 0 7px,#ead9bf 7px 14px)!important}
.ag-busy{font-size:11px;line-height:1.35;color:var(--dim);font-weight:800;margin-bottom:5px}
.ag-chip{display:flex;align-items:flex-start;gap:4px;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);
  border-left:4px solid var(--c);border-radius:9px;padding:5px 5px;font-size:12px;font-weight:700;margin-bottom:4px;line-height:1.2}
.ag-chip:hover{box-shadow:var(--shadow)}
.ag-chip .ag-txt{flex:1;min-width:0;overflow-wrap:break-word}
.ag-chip .ag-txt small{display:block;font-size:11px;color:var(--dim);font-weight:800}
.ag-chip.hecha{opacity:.55} .ag-chip.hecha .ag-txt{text-decoration:line-through}
.ag-chip.conflicto{border-color:var(--red);border-left-color:var(--red);background:#fff6f6}
.ag-warn{color:var(--red)}
.ag-mini{border-collapse:separate;border-spacing:4px;margin:0 auto}
.ag-mini th{border:none;padding:2px;font-size:11px;text-align:center;color:var(--dim)}
.ag-mini td{border:none;padding:0}
.ag-pick{width:38px;height:38px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-size:14px;color:var(--accent-text);display:grid;place-items:center}
.ag-pick:hover{border-color:var(--accent)}
.ag-pick.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.ag-pick.ley{display:inline-grid;width:14px;height:14px;border-radius:4px;font-size:8px;vertical-align:middle;margin-right:3px}
.ho-dias{display:flex;gap:6px}
.ho-dias label{flex:1}
.ho-dias input{display:none}
.ho-dias span{display:grid;place-items:center;height:40px;border-radius:11px;border:1.5px solid var(--line);background:var(--bg2);font-weight:800;color:var(--dim);cursor:pointer}
.ho-dias input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* =========================================================
   MÓVIL (hijo)
   ========================================================= */
/* ----- Calendario (hijo) ----- */
.hoy-card{border-color:#ffd9b8;background:linear-gradient(160deg,#fff,#fff6ec)}
.sem-fr{margin-top:8px}
.sem-fr-h{font-size:11px;font-weight:800;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px}
.sem-item{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid var(--line)}
.sem-item:last-child{border:none}
.sem-item small{display:block;font-size:12px;color:var(--dim);font-weight:700;margin-top:2px}
.sem-item.hecha{opacity:.55} .sem-item.hecha b{text-decoration:line-through}
.sem-ico{width:38px;height:38px;border-radius:11px;background:var(--card2);border:1.5px solid var(--line);display:grid;place-items:center;font-size:18px;flex:none}
.sem-diarias{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.sem-dia{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:0 15px;margin-bottom:10px;box-shadow:var(--shadow)}
.sem-dia.hoy{border-color:var(--accent)}
.sem-dia summary{display:flex;align-items:center;gap:8px;min-height:54px;cursor:pointer;list-style:none}
.sem-dia summary::-webkit-details-marker{display:none}
.sem-dia[open]{padding-bottom:12px}
.sem-d{font-family:var(--num);font-weight:600;font-size:17px}
.sem-ocup{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px}
.sem-ocup span{font-size:12px;font-weight:700;color:var(--dim);background:var(--bg2);border-radius:8px;padding:4px 8px}
.mob{display:none}
.mob .phone{max-width:480px;margin:0 auto;padding:58px 16px 100px;position:relative;min-height:100vh}
.mob .head{display:flex;align-items:center;gap:13px;margin-bottom:18px}
.mob .head .avatar{width:48px;height:48px;font-size:20px;box-shadow:var(--shadow)}
.mob .head h1{font-size:20px} .mob .head .sub{font-size:12px;color:var(--dim);margin-top:2px;font-weight:700}
.mob .icon-btn{margin-left:auto;width:44px;height:44px;border-radius:14px;background:#fff;border:1.5px solid var(--line);display:grid;place-items:center;box-shadow:var(--shadow)}
.mob .icon-btn svg{width:22px;height:22px;stroke:var(--dim);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.hero{background:linear-gradient(150deg,#fff,#fff0df 60%,#ffe7ec);border:1.5px solid #ffe1bd;border-radius:24px;padding:21px;margin-bottom:16px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.hero::after{content:"";position:absolute;right:-26px;top:-26px;width:130px;height:130px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,194,75,.45),transparent)}
.hero::before{content:"☀️";position:absolute;right:16px;top:14px;font-size:26px;opacity:.85}
.hero .label{font-size:12px;color:var(--dim);font-weight:700} .hero .big{font-family:var(--num);font-size:44px;font-weight:700;margin-top:6px;line-height:1;color:var(--accent-text)}
.hero .big small{font-size:19px;color:var(--dim)}
.ring{width:66px;height:66px;border-radius:50%;display:grid;place-items:center;flex:none;background:conic-gradient(var(--accent) calc(var(--pct)*1%), #f1e4d0 0);box-shadow:0 4px 10px rgba(255,122,89,.22)}
.ring .inner{width:52px;height:52px;border-radius:50%;background:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;font-family:var(--num);color:var(--text)}
.task{display:flex;align-items:center;gap:13px;background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:14px;margin-bottom:11px;box-shadow:var(--shadow)}
.task.approved{opacity:.6} .task .tname{font-weight:800} .task .tsub{font-size:12px;color:var(--dim);margin-top:5px}
.mcard{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:15px;margin-bottom:12px;box-shadow:var(--shadow)}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;text-align:center}
.badge{aspect-ratio:1;border-radius:17px;background:linear-gradient(155deg,#fff,#fdf1e0);border:1.5px solid var(--line);display:grid;place-items:center;font-size:26px;box-shadow:var(--shadow);animation:pop .4s both}
.badge:nth-child(2){animation-delay:.04s}.badge:nth-child(3){animation-delay:.08s}.badge:nth-child(4){animation-delay:.12s}
.badge:nth-child(5){animation-delay:.16s}.badge:nth-child(6){animation-delay:.2s}.badge:nth-child(7){animation-delay:.24s}.badge:nth-child(8){animation-delay:.28s}
.badge.locked{opacity:.4;filter:grayscale(.7);box-shadow:none} .badge .l{font-size:11px;color:var(--dim);margin-top:3px;font-weight:700}
.day{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.day:last-child{border:none} .day .dn{width:42px;font-size:12px;color:var(--accent-text);font-weight:800;text-transform:uppercase}
.seg{display:flex;background:var(--bg2);border:1.5px solid var(--line);border-radius:13px;padding:3px;gap:3px}
.seg button{flex:1;padding:9px;border-radius:10px;font-size:13px;color:var(--dim);font-weight:800}
.seg button.on{background:var(--accent);color:var(--accent-ink);box-shadow:0 3px 8px rgba(255,122,89,.3)}
.nav{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);border-top:1.5px solid var(--line);display:flex;padding:9px 6px calc(9px + env(safe-area-inset-bottom));z-index:20;box-shadow:0 -6px 20px rgba(180,120,70,.08)}

<body>
<div id="picker"></div>
<div class="modebar" id="modebar"></div>
<div class="desk" id="desk"></div>
<div class="mob" id="mob"></div>
<div class="sheet-bg" id="sheetBg" onclick="closeSheet()"></div>
<div class="sheet" id="sheet"></div>
<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()"><div class="modal" id="modal"></div></div>
<!-- Los cuatro perfiles de la casa. El mismo archivo lo carga el servidor con
     require(), para que no haya dos listas que puedan divergir. -->
<script src="/perfiles.js"></script>
<!-- Idiomas: motor y catálogo de traducciones, compartido con el servidor (avisos). -->
<script src="/i18n.js"></script>
<script>
// =========================================================================
//  IDIOMA
//  La interfaz se escribe en español. Con otro idioma, i18n.js traduce lo que
//  se pinta (ver docs/adr/0011). Es una preferencia del dispositivo: vive en
//  localStorage, nunca en el estado compartido. Cambiarlo recarga la página.
// =========================================================================
const IDIOMA=idiomaGuardado();
const LOCALE=localeDe(IDIOMA);
observarIdioma(IDIOMA);
function cambiarIdioma(id){
  if(id===IDIOMA) return;
  guardarIdioma(id);
  location.reload();
}
// Selector de idioma. Los nombres van en su propio idioma y no se traducen.
const selectorIdioma=()=>`<div class="lang-pick" translate="no" role="group" aria-label="Idioma / Language">${
  IDIOMAS.map(i=>`<button class="${i.id===IDIOMA?"on":""}" aria-pressed="${i.id===IDIOMA}" onclick="cambiarIdioma('${i.id}')">${i.nombre}</button>`).join("")}</div>`;

// =========================================================================
//  HELPER FETCH
//
//  Cada petición lleva dos cabeceras:
//   - X-Casa:   el código de casa. ES la llave: sin él la API no responde.
//               Llega una vez por enlace y se guarda en este dispositivo.
//   - X-Perfil: quién usa este móvil. No es una llave: sirve para que el
//               servidor sepa si quien escribe es un hijo (reporta tareas) o
//               los papás (validan y cambian los ajustes de la casa).
// =========================================================================
function cabecerasApi(extra){
  return Object.assign({ "X-Perfil": perfilActual() || PERFIL_POR_DEFECTO, "X-Casa": codigoCasa() }, extra||{});
}
async function api(url, opts){
  const o = Object.assign({}, opts||{});
  o.headers = cabecerasApi(o.headers);
  if (o.body && typeof o.body !== "string") {
    o.body = JSON.stringify(o.body);
    o.headers["Content-Type"] = "application/json";
  }
  const r = await fetch(url, o);
  let data = null;
  try { data = await r.json(); } catch(e) {}
  if (!r.ok) {
    const err = new Error((data && data.error) || ("http_"+r.status));
    err.status = r.status; err.payload = data;
    // Sin código (o con uno que ya no vale): se para todo y se pide.
    if (r.status === 401 && err.message === "codigo_casa") pedirCodigoCasa();
    throw err;
  }
  return data;
}
// =========================================================================
//  ESTADO Y PERSISTENCIA
// =========================================================================
let _saveTimer=null, _lastSent=0;
// Copia del estado tal y como lo entregó el servidor la última vez. Sirve para
// saber QUÉ he cambiado yo si al guardar resulta que alguien escribió antes.
let _base=null;
const marcarBase=()=>{ try{ _base=JSON.parse(JSON.stringify(S)); }catch(e){ _base=null; } };

// Campos que son de este dispositivo y no viajan al servidor.
const LOCALES=["view","profile","deskTab","mobTab"];

// Fusión por campos: sobre el estado fresco del servidor se vuelven a aplicar
// los campos que YO había tocado desde mi última lectura.
// Es una fusión gruesa (por campo de primer nivel), no perfecta: si dos
// dispositivos tocan el MISMO campo, sigue ganando el último. Pero evita el
// caso habitual y sangrante: que un hijo marque una tarea y a la vez su padre
// cambie la paga, y uno de los dos cambios desaparezca sin avisar.
function fusionarCambios(fresco, mio, base){
  const salida={...fresco};
  if(!base) return {...mio, _version:fresco._version};
  Object.keys(mio).forEach(k=>{
    if(k==="_version"||LOCALES.includes(k)) return;
    const yoLoCambie = JSON.stringify(mio[k])!==JSON.stringify(base[k]);
    if(yoLoCambie) salida[k]=mio[k];
  });
  salida._version=fresco._version;
  return salida;
}

const Store = {
  read(){ return null; },
  write(s){
    clearTimeout(_saveTimer);
    _saveTimer=setTimeout(async()=>{
      _lastSent=Date.now();
      try{
        const r=await api("/api/state",{method:"PUT",body:s});
        S._version=r.version; marcarBase();
      }catch(e){
        if(e.status===409 && e.payload && e.payload.error==="version_desfasada"){
          await resolverConflicto();
        }else if(e.status!==401){
          showConn(false);
        }
      }
    },250);
  },
};

// Alguien guardó entre que leí y guardé. Se trae el estado fresco, se le
// vuelven a aplicar mis cambios y se reintenta UNA vez. Si vuelve a fallar,
// se adopta el del servidor y se avisa: mejor perder un cambio sabiéndolo que
// perderlo en silencio.
let _resolviendo=false;
async function resolverConflicto(){
  if(_resolviendo) return;
  _resolviendo=true;
  try{
    const fresco=await api("/api/state");
    const locales={}; LOCALES.forEach(k=>{ locales[k]=S[k]; });
    const fusionado=fusionarCambios(fresco, S, _base);
    S=Object.assign(fusionado, locales);
    ensureShape();
    const r=await api("/api/state",{method:"PUT",body:S});
    S._version=r.version; marcarBase();
    render({quiet:true});
  }catch(e){
    try{
      const fresco=await api("/api/state");
      const locales={}; LOCALES.forEach(k=>{ locales[k]=S[k]; });
      S=Object.assign(fresco, locales);
      ensureShape(); marcarBase(); render({quiet:true});
      showConn(true);
      alert("Otro dispositivo guardó al mismo tiempo y tu último cambio no se pudo aplicar. Revísalo, por favor.");
    }catch(e2){ showConn(false); }
  }finally{ _resolviendo=false; }
}
function showConn(ok){
  const el=document.getElementById("connDot"); if(!el)return;
  el.style.background = ok? "var(--green)" : "var(--red)";
  el.title = ok? "Conectado" : "Sin conexión con el servidor";
}
const uid=p=>p+Math.random().toString(36).slice(2,8);
// Todo lo que venga del estado se pinta con innerHTML: hay que escaparlo SIEMPRE.
// El estado es compartido dentro de la familia, así que los textos que escribe
// un miembro acaban en la pantalla de los demás. Se escapa también la comilla
// simple para que sea seguro dentro de atributos y de onclick="fn('...')".
const esc=s=>String(s==null?"":s).replace(/[<>&"']/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;","'":"&#39;"}[c]));
// Color que se inserta dentro de un atributo style: solo se admite hexadecimal.
const escColor=c=>/^#[0-9a-fA-F]{6}$/.test(String(c||""))?String(c):"#9c8a76";
const fmt=n=>(Math.round(n*100)/100).toFixed(2);
const LOAD={normal:1,reducida:.6,minima:.3};
const LOAD_LABEL={normal:"Normal",reducida:"Reducida",minima:"Mínima"};
const DAYS=["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"];
const monthName=k=>{const[y,m]=String(k||"").split("-");return nombresMeses(IDIOMA)[+m-1]+" "+y};
// Las claves de semana y mes las calcula el SERVIDOR (services/tiempo.js) y llegan
// en S.currentWeek / S.currentMonth. El cliente no las genera nunca.
// ---- Menús -----------------------------------------------------------------
// Un plato es {id, name, type, tags} y el menú guarda IDs de plato:
//   S.menu = { Lun:{desayuno:"d1", comida:"d3", cena:""}, ... }
// Guardar el id y no el nombre permite renombrar un plato sin romper el menú.
const MEALS=["desayuno","comida","cena"];
const MEAL_LABEL={desayuno:"Desayuno",comida:"Comida",cena:"Cena"};
const PLATO_DESCONOCIDO={id:"",name:"—",type:"comida",tags:[]};
const dishById=id=>(S.dishes||[]).find(p=>p&&p.id===id)||PLATO_DESCONOCIDO;
const dishesOfType=t=>(S.dishes||[]).filter(p=>p&&p.type===t);
const menuAt=(day,meal)=>((S.menu||{})[day]||{})[meal]||"";
const dishNameAt=(day,meal)=>{const id=menuAt(day,meal); return id?dishById(id).name:""};

const todayIdx=()=>(new Date().getDay()+6)%7; // Lun=0 ... Dom=6
const DAYLBL=diasCortos(IDIOMA);
const DIAS_LARGOS=diasLargos(IDIOMA);
const isDaily=t=>t.freq==="daily";

// La semilla vive SOLO en el servidor (services/estadoService.js):
// tener una copia aqui significaba dos verdades que podian divergir.
let S = null; // se carga del servidor en bootstrap()
function ensureShape(){
  if(!S) return; // el estado aún no ha llegado del servidor
  // Campos de navegación (son de este dispositivo; el servidor no los manda)
  if(!S.deskTab) S.deskTab="home";
  if(!S.mobTab) S.mobTab="home";
  if(!S.profile) S.profile=perfilActual()||PERFIL_POR_DEFECTO;
  if(!S.view) S.view=esHijo(S.profile)?"mob":"desk";
  // Añade campos nuevos a estados guardados antes de tener mercado.
  if(!Array.isArray(S.listings)) S.listings=[];
  if(!Array.isArray(S.offers)) S.offers=[];
  if(!Array.isArray(S.marketLog)) S.marketLog=[];
  if(Array.isArray(S.extras)) S.extras.forEach(x=>{ if(x.listed===undefined) x.listed=false; });
  if(Array.isArray(S.fixedTasks)) S.fixedTasks.forEach(t=>{ if(!t.freq) t.freq="daily"; });
  if(!S.fixedState || typeof S.fixedState!=="object") S.fixedState={};

  // --- Migración de los menús -----------------------------------------------
  // Las familias antiguas guardaban los platos como texto suelto y el menú
  // como un plato por día. Ahora un plato es un objeto y cada día tiene
  // desayuno, comida y cena. Sin esta conversión, esas familias verían
  // "[object Object]" en el selector de platos.
  if(!Array.isArray(S.dishes)) S.dishes=[];
  S.dishes=S.dishes.map((p,i)=> (p && typeof p==="object")
    ? {id:p.id||("d"+i), name:p.name||"", type:MEALS.includes(p.type)?p.type:"comida", tags:Array.isArray(p.tags)?p.tags:[]}
    : {id:"d"+i, name:String(p), type:"comida", tags:[]}
  ).filter(p=>p.name);
  if(!S.menu || typeof S.menu!=="object") S.menu={};
  DAYS.forEach(d=>{
    const v=S.menu[d];
    if(v && typeof v==="object"){
      MEALS.forEach(m=>{ if(typeof v[m]!=="string") v[m]=""; });
    }else{
      // Antes era el nombre de un plato: se busca su id y se pone como comida.
      const encontrado=S.dishes.find(p=>p.name===v);
      S.menu[d]={desayuno:"", comida:encontrado?encontrado.id:"", cena:""};
    }
  });

  delete S.swaps; delete S.fixedInstances;
}

// ---- Reinicios de ciclo --------------------------------------------------
// El reinicio semanal y el mensual los decide EL SERVIDOR con su propio reloj
// (ver aplicarCiclos en routes/state.js). Antes los disparaba el reloj del
// dispositivo: bastaba con que un móvil tuviera la fecha mal puesta para
// reiniciar la semana o el mes de toda la familia. El cliente solo lee
// S.currentWeek / S.currentMonth; nunca los cambia.
const save=()=>Store.write(S);
const $=id=>document.getElementById(id);
const children=()=>S.members.filter(m=>m.role==="child");
const member=id=>S.members.find(m=>m.id===id);

// =========================================================================
//  MOTOR
// =========================================================================
function generateMonth(){
  // Repartir de nuevo borra el progreso y las validaciones del reparto anterior.
  if(S.generated && !confirm("Volver a repartir borrará el reparto actual, lo que tus hijos ya hayan marcado y los anuncios del mercado. ¿Continuar?")) return;
  // Fijas: una instancia por hijo (mismas tareas para todos)
  initFixedWeek();
  // El mercado se refiere a asignaciones que van a desaparecer: se cierra entero.
  S.listings.forEach(l=>{ if(l.status==="open") l.status="cancelled"; });
  S.offers.forEach(o=>{ if(o.status==="pending") o.status="rejected"; });
  // Adicionales: repartir por peso según disponibilidad
  const kids=children();
  const sumF=kids.reduce((s,c)=>s+LOAD[c.load],0)||1;
  const total=S.extraTasks.reduce((s,t)=>s+t.points,0);
  const bins=kids.map(c=>({id:c.id,target:(total*LOAD[c.load])/sumF,load:0}));
  const ordered=[...S.extraTasks].sort((a,b)=>b.points-a.points);
  S.extras=[];
  for(const t of ordered){
    bins.sort((a,b)=>(b.target-b.load)-(a.target-a.load));
    bins[0].load+=t.points;
    S.extras.push({id:uid("x"),taskId:t.id,memberId:bins[0].id,status:"pending"});
  }
  S.generated=true; save();
}

const fixedTask=id=>S.fixedTasks.find(t=>t.id===id);
const fixedStateOf=(childId,taskId)=>(S.fixedState[childId]||{})[taskId];
function fixedUnits(t){ return isDaily(t)?7:1; }
function initFixedWeek(){
  S.fixedState={};
  children().forEach(c=>{ S.fixedState[c.id]={};
    S.fixedTasks.forEach(t=>{ S.fixedState[c.id][t.id]= isDaily(t)?{days:[false,false,false,false,false,false,false]}:{status:"pending"}; });
  });
}
// Asegura que fixedState tiene forma correcta (nuevos hijos/tareas/cambios de frecuencia)
// Rellena las casillas que falten. Devuelve si ha cambiado algo, para poder
// guardarlo: una mutación local que no se guarda hace que el sondeo vea siempre
// diferencia con el servidor y repinte la pantalla cada 4 segundos.
// El servidor ya entrega el estado con forma completa; esto es red de seguridad.
function ensureFixedShape(){
  let cambio=false;
  if(!S.fixedState){ S.fixedState={}; cambio=true; }
  children().forEach(c=>{
    if(!S.fixedState[c.id]){ S.fixedState[c.id]={}; cambio=true; }
    S.fixedTasks.forEach(t=>{
      const cur=S.fixedState[c.id][t.id];
      if(!cur || isDaily(t)!==Array.isArray(cur.days)){
        S.fixedState[c.id][t.id]= isDaily(t)?{days:[false,false,false,false,false,false,false]}:{status:"pending"};
        cambio=true;
      }
    });
  });
  return cambio;
}
function fixedApprovedUnits(childId){
  let n=0;
  S.fixedTasks.forEach(t=>{ const st=fixedStateOf(childId,t.id); if(!st)return;
    if(isDaily(t)) n+=(st.days||[]).filter(Boolean).length; else n+=(st.status==="approved")?1:0; });
  return n;
}
function fixedTotalUnits(childId){ return S.fixedTasks.reduce((s,t)=>s+fixedUnits(t),0); }
const extraTask=id=>S.extraTasks.find(t=>t.id===id);

function fixedRatio(childId){
  const tot=fixedTotalUnits(childId); if(!tot) return 1;
  return fixedApprovedUnits(childId)/tot;
}
function extraPointsApproved(childId){
  return S.extras.filter(x=>x.memberId===childId&&x.status==="approved")
    .reduce((s,x)=>s+extraTask(x.taskId).points,0);
}
function extraPointsAssigned(childId){
  return S.extras.filter(x=>x.memberId===childId).reduce((s,x)=>s+extraTask(x.taskId).points,0);
}
// Puntos del mes (para nivel) = fijas aprobadas (10pts c/u) + adicionales aprobadas
function monthPoints(childId){
  return Math.max(0, fixedApprovedUnits(childId)*2 + extraPointsApproved(childId) + marketBountyNet(childId));
}
// Neto de PUNTOS por primas del mercado, solo de tareas ya APROBADAS.
// (afecta al nivel/premios; el dinero va por el esfuerzo de la tarea hecha)
function marketBountyNet(childId){
  let net=0;
  S.extras.filter(x=>x.status==="approved"&&x.bounty).forEach(x=>{
    if(x.bounty.to===childId) net+=x.bounty.points;
    if(x.bounty.from===childId) net-=x.bounty.points;
  });
  return net;
}
function money(childId){
  const ratio=fixedRatio(childId);
  const fixedEarned=ratio>=0.75?S.fixedPay:0;
  const canExtra=ratio>=1;
  const extraEarned=canExtra?extraPointsApproved(childId)*S.rate:0;
  return {ratio,fixedEarned,extraEarned,total:Math.max(0,fixedEarned+extraEarned),canExtra};
}
function levelOf(childId){ const p=monthPoints(childId); return {level:Math.floor(p/100)+1,into:p%100,points:p}; }

// ---- Premios y canjes ------------------------------------------------------
// Los puntos de una solicitud quedan RESERVADOS en cuanto se pide, aunque el
// padre aún no la haya aprobado. Si no, un hijo podría pedir tres premios con
// los puntos justos para uno.
const redemptions=()=>Array.isArray(S.redemptions)?S.redemptions:(S.redemptions=[]);
const rewardById=id=>(S.rewards||[]).find(r=>r.id===id)||{id:"",title:"(premio eliminado)",cost:0,type:"",stock:null,active:false};
function pointsCommitted(childId){
  return redemptions()
    .filter(c=>c.childId===childId && (c.status==="pending"||c.status==="approved"))
    .reduce((s,c)=>s+(c.cost||0),0);
}
// Lo que le queda de verdad para gastar.
function pointsAvailable(childId){
  return Math.max(0, monthPoints(childId) - pointsCommitted(childId));
}
const pendingRedemptions=()=>redemptions().filter(c=>c.status==="pending");
// ¿Quedan unidades de este premio? stock null = ilimitado.
function rewardStockLeft(r){
  if(r.stock==null) return Infinity;
  const usados=redemptions().filter(c=>c.rewardId===r.id && c.status==="approved").length;
  return Math.max(0, r.stock-usados);
}
function rewardAvailable(r){ return r.active!==false && rewardStockLeft(r)>0; }

// ---- Calendario ------------------------------------------------------------
// Los papás deciden en qué día y franja hace cada uno sus tareas, encajándolas
// en los huecos que dejan el colegio, los entrenamientos, etc.
//
//   S.horarios = { mateo:[{id,label,days:[0..6],ini:"HH:MM",fin:"HH:MM"}], ... }
//   S.agenda   = [{kind:"fixed",taskId,childId,day,slot}, {kind:"extra",taskId,day,slot}]
//
// La agenda es una PLANTILLA: vale para todas las semanas hasta que se cambie.
// Las adicionales no guardan hijo: lo saca de la asignación del mes, así que la
// entrada sobrevive al reparto mensual y sigue a la tarea si cambia de dueño en
// el mercado.
//
// OJO: aquí nada muta S.horarios ni S.agenda al LEER. Las casas antiguas que no
// los tienen los reciben ya rellenos del servidor (normalizarCalendario); si el
// cliente los rellenara en local sin guardar, el sondeo vería diferencia en cada
// vuelta y volvería el bucle de repintado.
// La mañana empieza a las 9 a propósito: si empezara a las 7, la hora antes del
// colegio contaría como "libre" y se acabarían colocando tareas un lunes a las 7.
const FRANJAS=[
  {id:"manana",label:"Mañana",ini:"09:00",fin:"14:00",ico:"🌅"},
  {id:"tarde", label:"Tarde", ini:"14:00",fin:"20:00",ico:"☀️"},
  {id:"noche", label:"Noche", ini:"20:00",fin:"23:00",ico:"🌙"},
];
// Una franja cuenta como libre si le quedan al menos estos minutos sin ocupar.
const MIN_LIBRE=45;
// Al repartir se prefiere la tarde: por la mañana suele haber colegio.
const PREFERENCIA_FRANJA={tarde:0,noche:1,manana:2};
const franjaById=id=>FRANJAS.find(f=>f.id===id)||FRANJAS[0];
const minutos=h=>{const [a,b]=String(h||"0:0").split(":").map(Number); return (a||0)*60+(b||0);};
const agenda=()=>Array.isArray(S.agenda)?S.agenda:[];
const horariosDe=childId=>((S.horarios||{})[childId])||[];
const claveAgenda=e=>e.kind+"|"+e.taskId+"|"+(e.kind==="fixed"?e.childId:"");

function bloquesDe(childId,day){ return horariosDe(childId).filter(b=>(b.days||[]).includes(day)); }
// Bloques que pisan (aunque sea en parte) una franja.
function bloquesEnFranja(childId,day,slot){
  const f=franjaById(slot), i=minutos(f.ini), e=minutos(f.fin);
  return bloquesDe(childId,day).filter(b=>minutos(b.ini)<e && minutos(b.fin)>i);
}
// Minutos sin ocupar dentro de una franja. Los bloques que se solapan entre sí
// se cuentan una sola vez (colegio hasta las 14:30 + comedor hasta las 15:00).
function minutosLibres(childId,day,slot){
  const f=franjaById(slot), i=minutos(f.ini), e=minutos(f.fin);
  const tramos=bloquesDe(childId,day)
    .map(b=>[Math.max(i,minutos(b.ini)),Math.min(e,minutos(b.fin))])
    .filter(([a,b])=>b>a).sort((x,y)=>x[0]-y[0]);
  let ocupado=0, hasta=i;
  tramos.forEach(([a,b])=>{ if(b<=hasta) return; ocupado+=b-Math.max(a,hasta); hasta=b; });
  return (e-i)-ocupado;
}
const franjaLibre=(childId,day,slot)=>minutosLibres(childId,day,slot)>=MIN_LIBRE;

// Quién hace una entrada: en las fijas, el hijo apuntado; en las adicionales,
// quien la tenga asignada este mes.
function asignacionExtra(taskId){ return (S.extras||[]).find(x=>x.taskId===taskId); }
function hijoDeEntrada(e){
  if(e.kind==="fixed") return e.childId;
  const x=asignacionExtra(e.taskId); return x?x.memberId:null;
}

// Entradas de la agenda listas para pintar. Las que ya no casan (tarea borrada,
// adicional sin repartir este mes…) se ignoran sin borrarlas: las limpia el
// servidor al guardar.
function itemsAgenda(){
  return agenda().map(e=>{
    const tarea=e.kind==="fixed"?fixedTask(e.taskId):extraTask(e.taskId);
    if(!tarea || (e.kind==="fixed" && isDaily(tarea))) return null;
    const hijo=hijoDeEntrada(e);
    if(!hijo || !member(hijo)) return null;
    const x=e.kind==="extra"?asignacionExtra(e.taskId):null;
    const estado=e.kind==="fixed"?((fixedStateOf(hijo,e.taskId)||{}).status||"pending"):x.status;
    return {e, clave:claveAgenda(e), tarea, hijo, estado,
      listed:!!(x&&x.listed), hecha:estado==="approved",
      conflicto:!franjaLibre(hijo,e.day,e.slot)};
  }).filter(Boolean);
}

// Lo que todavía no tiene día: cada fija semanal de cada hijo y cada adicional
// repartida este mes.
function sinColocar(){
  const puestas=new Set(agenda().map(claveAgenda));
  const r=[];
  children().forEach(c=>(S.fixedTasks||[]).filter(t=>!isDaily(t)).forEach(t=>{
    const e={kind:"fixed",taskId:t.id,childId:c.id};
    if(!puestas.has(claveAgenda(e))) r.push({e,tarea:t,hijo:c.id});
  }));
  (S.extras||[]).forEach(x=>{
    const t=extraTask(x.taskId); if(!t) return;
    const e={kind:"extra",taskId:x.taskId};
    const k=claveAgenda(e);
    if(!puestas.has(k)){ puestas.add(k); r.push({e,tarea:t,hijo:x.memberId}); }
  });
  return r;
}

// Propuesta de reparto. Determinista (sin azar) para que sea predecible:
//   - solo coloca lo que falta; respeta lo que los papás ya movieron a mano,
//   - primero las adicionales más pesadas, luego las fijas semanales,
//   - nunca en una franja ocupada,
//   - de entre las libres elige, por este orden: el día en que ese hijo tenga
//     menos tareas, la franja menos cargada de la casa, entre semana antes que
//     el finde, y la tarde antes que la noche o la mañana.
// Devuelve la agenda nueva y lo que no ha cabido. No guarda nada.
function planificarSemana(){
  const pendientes=sinColocar().sort((a,b)=>
    (b.e.kind==="extra"?b.tarea.points:0)-(a.e.kind==="extra"?a.tarea.points:0));
  const nueva=agenda().map(e=>({...e}));
  const sinHueco=[];
  const menor=(a,b)=>{ for(let i=0;i<a.length;i++){ if(a[i]!==b[i]) return a[i]<b[i]; } return false; };
  pendientes.forEach(p=>{
    let mejor=null;
    for(let d=0;d<7;d++) for(const f of FRANJAS){
      if(!franjaLibre(p.hijo,d,f.id)) continue;
      const peso=[
        nueva.filter(e=>e.day===d && hijoDeEntrada(e)===p.hijo).length,
        nueva.filter(e=>e.day===d && e.slot===f.id).length,
        d>=5?1:0,
        PREFERENCIA_FRANJA[f.id],
      ];
      if(!mejor || menor(peso,mejor.peso)) mejor={day:d,slot:f.id,peso};
    }
    if(mejor) nueva.push({...p.e, day:mejor.day, slot:mejor.slot});
    else sinHueco.push(p);
  });
  return {agenda:nueva, colocadas:pendientes.length-sinHueco.length, sinHueco};
}

// "L–V" para días seguidos, "M, J" para sueltos.
function diasTexto(days){
  const d=[...(days||[])].sort((a,b)=>a-b);
  if(d.length>=3 && d[d.length-1]-d[0]===d.length-1) return DAYLBL[d[0]]+"–"+DAYLBL[d[d.length-1]];
  return d.map(i=>DAYLBL[i]).join(", ");
}
const textoBloque=b=>b.label+" "+b.ini+"–"+b.fin;
// Igual, pero recortado a una franja: en la tarde, "Colegio hasta 14:30" se
// entiende mejor que "Colegio 08:00–14:30", que parece ocupar toda la tarde.
function textoBloqueEn(b,slot){
  const f=franjaById(slot);
  const antes=minutos(b.ini)<=minutos(f.ini), despues=minutos(b.fin)>=minutos(f.fin);
  if(antes && despues) return b.label;
  if(antes) return b.label+" hasta "+b.fin;
  if(despues) return b.label+" desde "+b.ini;
  return textoBloque(b);
}

function yaPedida(listingId){

// Publicar una tarea adicional propia en el mercado.
function publishListing(assignmentId){
  const pts = Math.max(0, parseInt(($("plPoints")||{}).value,10) || 0);
  const trade = ($("plTrade")||{}).checked;
  const note = (($("plNote")||{}).value || "").trim();
  if(pts<=0 && !trade){ alert("Ofrece puntos o permite trueque (o ambos)."); return; }
  const x=S.extras.find(e=>e.id===assignmentId);
  if(!x || x.status!=="pending" || x.listed) return;
  S.listings.push({id:uid("l"), sellerId:x.memberId, assignmentId, taskId:x.taskId,
    pointsOffered:pts, acceptsTrade:!!trade, note, status:"open", createdAt:Date.now()});
  x.listed=true; save(); closeSheet(); render();
}
function cancelListing(listingId){
  const l=S.listings.find(x=>x.id===listingId); if(!l||l.status!=="open")return;
  l.status="cancelled";
  S.offers.filter(o=>o.listingId===listingId&&o.status==="pending").forEach(o=>o.status="rejected");
  const x=S.extras.find(e=>e.id===l.assignmentId); if(x)x.listed=false;
  save(); render();
}
// "Me la quedo": cierre directo por los puntos ofrecidos.
// "Me la quedo" ya NO cierra el trato de golpe: crea una solicitud que el
// vendedor tiene que aceptar, igual que el trueque. Antes un hermano podía
// quedarse la tarea de otro sin que este se enterara hasta después, y el
// vendedor no podía echarse atrás aunque hubiera puesto mal el precio.
function takeListing(listingId, bidderId){
  const l=S.listings.find(x=>x.id===listingId); if(!l||l.status!=="open"||bidderId===l.sellerId)return;
  const x=S.extras.find(e=>e.id===l.assignmentId); if(!x||x.status!=="pending")return;
  // Si ya había pedido esta misma tarea, no se duplica
  if(S.offers.some(o=>o.listingId===listingId&&o.bidderId===bidderId&&o.status==="pending")){
    alert("Ya has pedido esta tarea. Espera a que te responda."); closeSheet(); return;
  }
  S.offers.push({id:uid("o"), listingId, bidderId, kind:"take",
    offeredAssignmentId:"", offeredTaskId:"", pointsAsked:0,
    status:"pending", createdAt:Date.now()});
  save(); closeSheet(); render();
}
// Ofrecer un trueque: una de mis tareas a cambio (+ puntos opcionales que pido).
function submitTradeOffer(listingId, bidderId){
  const offeredId = ($("toTask")||{}).value;
  const pts = Math.max(0, parseInt(($("toPoints")||{}).value,10) || 0);
  const l=S.listings.find(x=>x.id===listingId); if(!l||l.status!=="open"||!l.acceptsTrade)return;
  const off=S.extras.find(e=>e.id===offeredId);
  if(!off || off.memberId!==bidderId || off.status!=="pending" || off.listed){ alert("Elige una tarea válida tuya."); return; }
  S.offers.push({id:uid("o"), listingId, bidderId, offeredAssignmentId:offeredId, offeredTaskId:off.taskId,
    pointsAsked:pts, status:"pending", createdAt:Date.now()});
  save(); closeSheet(); render();
}
function rejectOffer(offerId){ const o=S.offers.find(x=>x.id===offerId); if(o&&o.status==="pending"){o.status="rejected";save();render()} }
// El vendedor acepta un trueque: se intercambian las tareas (+ compensación en puntos).
// El vendedor acepta. Vale para los dos tipos de solicitud:
//   take  -> el otro se queda la tarea; si el vendedor ofrecía puntos, se los paga
//   trade -> se intercambian las dos tareas (+ compensación opcional)
function acceptOffer(offerId){
  const o=S.offers.find(x=>x.id===offerId); if(!o||o.status!=="pending")return;
  const l=S.listings.find(x=>x.id===o.listingId); if(!l||l.status!=="open")return;
  const sellerTask=S.extras.find(e=>e.id===l.assignmentId);
  if(!sellerTask||sellerTask.status!=="pending"){
    alert("Esa tarea ya no está disponible."); o.status="rejected"; save(); render(); return;
  }

  if(o.kind==="take"){
    sellerTask.memberId=o.bidderId; sellerTask.listed=false;
    if(l.pointsOffered>0) sellerTask.bounty={points:l.pointsOffered, from:l.sellerId, to:o.bidderId};
    S.marketLog.push({kind:"take", taskId:l.taskId, from:l.sellerId, to:o.bidderId, points:l.pointsOffered, at:Date.now()});
  }else{
    const bidderTask=S.extras.find(e=>e.id===o.offeredAssignmentId);
    if(!bidderTask||bidderTask.status!=="pending"){
      alert("La tarea que te ofrecían ya no está disponible."); o.status="rejected"; save(); render(); return;
    }
    sellerTask.memberId=o.bidderId; sellerTask.listed=false;
    bidderTask.memberId=l.sellerId;
    if(o.pointsAsked>0) sellerTask.bounty={points:o.pointsAsked, from:l.sellerId, to:o.bidderId};
    S.marketLog.push({kind:"trade", taskId:l.taskId, giveTaskId:o.offeredTaskId, from:l.sellerId, to:o.bidderId, points:o.pointsAsked, at:Date.now()});
  }

  o.status="accepted";
  l.status="closed";
  // El resto de solicitudes sobre ese anuncio se caen
  S.offers.filter(x=>x.listingId===l.id&&x.status==="pending").forEach(x=>x.status="rejected");
  save(); render();
}

// ---- Calendario: acciones de los papás ---------------------------------------
// Pone (o mueve) una tarea en un día y franja. Si el hijo tiene algo a esa
// hora se avisa, pero se deja: los papás conocen excepciones que la app no.
function colocarEnAgenda(kind,taskId,childId,day,slot){
  const e=kind==="fixed"?{kind,taskId,childId,day,slot}:{kind,taskId,day,slot};
  const hijo=hijoDeEntrada(e);
  if(hijo && !franjaLibre(hijo,day,slot)){
    const motivo=bloquesEnFranja(hijo,day,slot).map(textoBloque).join(", ");
    const nombre=(member(hijo)||{}).name||"";
    if(!confirm(nombre+" tiene ocupado "+DAYS[day]+" por la "+franjaById(slot).label.toLowerCase()+
      (motivo?" ("+motivo+")":"")+". ¿Colocarla ahí igualmente?")) return;
  }
  const k=claveAgenda(e);
  S.agenda=agenda().filter(x=>claveAgenda(x)!==k).concat([e]);
  save(); closeModal(); render();
}
function quitarDeAgenda(kind,taskId,childId){
  const k=claveAgenda({kind,taskId,childId});
  S.agenda=agenda().filter(x=>claveAgenda(x)!==k);
  save(); closeModal(); render();
}
function vaciarAgenda(){
  if(!agenda().length) return;
  if(!confirm("¿Quitar todas las tareas del calendario? Los horarios se quedan.")) return;
  S.agenda=[]; save(); render();
}
function organizarSemana(){
  const r=planificarSemana();
  if(!r.colocadas && !r.sinHueco.length){ openModal(`<h3 style="margin-bottom:10px">Todo colocado</h3>
    <p class="dim" style="font-size:14px">Todas las tareas ya tienen día. Para empezar de cero, usa <b>Vaciar</b>.</p>
    <button class="btn primary w" style="margin-top:16px" onclick="closeModal()">Vale</button>`); return; }
  S.agenda=r.agenda; save(); render();
  openModal(`<h3 style="margin-bottom:10px">🪄 Semana organizada</h3>
    <p style="font-size:14px;margin-bottom:12px"><b>${r.colocadas}</b> tarea(s) colocadas en huecos libres.</p>
    ${r.sinHueco.length?`<div class="mcard" style="border-color:var(--amber)">
      <b style="color:var(--amber)">Sin hueco (${r.sinHueco.length})</b>
      <p class="dim" style="font-size:12px;margin:4px 0 8px">Su hijo no tiene ninguna franja libre. Revisa sus horarios o colócalas a mano.</p>
      ${r.sinHueco.map(p=>`<div style="font-size:13px;padding:3px 0">${esc(p.tarea.icon)} ${esc(p.tarea.name)} · <b>${esc((member(p.hijo)||{}).name||"")}</b></div>`).join("")}
    </div>`:""}
    <p class="dim" style="font-size:12px;margin-top:12px">Puedes mover cualquier tarea pulsando sobre ella.</p>
    <button class="btn primary w" style="margin-top:14px" onclick="closeModal()">Vale</button>`);
}
function addHorario(childId){
  const label=($("hoLabel").value||"").trim();
  const days=[...document.querySelectorAll("#hoDias input:checked")].map(i=>+i.value);
  const ini=$("hoIni").value, fin=$("hoFin").value;
  const err=$("hoErr");
  if(!label){ err.textContent="Ponle un nombre (Colegio, Fútbol…)."; return; }
  if(!days.length){ err.textContent="Marca al menos un día."; return; }
  if(!ini || !fin || ini>=fin){ err.textContent="La hora de fin tiene que ser posterior a la de inicio."; return; }
  if(!S.horarios) S.horarios={};
  S.horarios[childId]=horariosDe(childId).concat([{id:uid("h"),label,days,ini,fin}]);
  save(); closeModal(); render();
}
function delHorario(childId,id){
  const b=horariosDe(childId).find(x=>x.id===id); if(!b) return;

// Contador de cosas pendientes por pestaña. Es el "aviso" de la app: sin

function deskBadge(tab){
  if(tab==="validate"){
    const extras=(S.extras||[]).filter(x=>x.status==="submitted").length;
    const fijas=children().reduce((n,k)=>n+(S.fixedTasks||[]).filter(t=>!isDaily(t))
      .filter(t=>{const st=fixedStateOf(k.id,t.id);return st&&st.status==="submitted";}).length,0);
    return extras+fijas;
  }
  if(tab==="rewards") return pendingRedemptions().length;
  return 0;
}
function mobBadge(tab){
  if(tab!=="market") return 0;

    (S.listings||[]).some(l=>l.id===o.listingId && l.sellerId===me && l.status==="open")).length;
}

// El padre resuelve una solicitud. Aprobar consolida el gasto (los puntos ya
// estaban reservados); denegar los libera al borrar la solicitud del cómputo.
function resolveRedeem(id,decision){
  const c=redemptions().find(x=>x.id===id);
  if(!c || c.status!=="pending") return;
  c.status = decision==="approved" ? "approved" : "denied";
  c.resolvedAt = Date.now();
  save(); render();
}
function toggleReward(id){
  const r=(S.rewards||[]).find(x=>x.id===id); if(!r) return;
  r.active = r.active===false;
  save(); render();
}
function delReward(id){
  const r=(S.rewards||[]).find(x=>x.id===id); if(!r) return;
  const usados=redemptions().filter(c=>c.rewardId===id).length;
  const aviso = usados
    ? `"${r.title}" tiene ${usados} solicitud(es) en el historial. Si lo borras, esas líneas quedarán sin nombre. ¿Mejor desactivarlo?\n\n¿Borrar de todos modos?`
    : `¿Borrar "${r.title}"?`;
  if(!confirm(aviso)) return;
  // Las solicitudes pendientes de ese premio se cancelan: si no, reservarían
  // puntos de un premio que ya no existe.
  S.redemptions=redemptions().filter(c=>!(c.rewardId===id && c.status==="pending"));
  S.rewards=S.rewards.filter(x=>x.id!==id);
  save(); render();
}
function addReward(){
  const t=$("rwTitle").value.trim(); if(!t) return;
  const coste=parseInt($("rwCost").value,10);
  if(!coste || coste<1){ alert("Pon un coste en puntos."); return; }
  const stockTxt=($("rwStock")||{}).value;
  const stock=stockTxt===""||stockTxt==null?null:Math.max(0,parseInt(stockTxt,10)||0);
  S.rewards.push({id:uid("r"), title:t, cost:coste, type:($("rwType")||{}).value||"Privilegio", stock, active:true});
  save(); closeModal(); render();
}
function modalAddReward(){ openModal(`<h3 style="margin-bottom:16px">Nuevo premio</h3>

function chipAgenda(it,conNombre){

    <table class="ag-grid"><thead><tr><th class="ag-fr"></th>
      ${DAYS.map((d,i)=>`<th class="${i===hoy?"hoy":""}">${d}</th>`).join("")}</tr></thead><tbody>
    ${FRANJAS.map(f=>`<tr><th class="ag-fr">${f.ico} ${f.label}<small>${f.ini}–${f.fin}</small></th>

        return `<td class="${cls}">${ocupado}${chips}</td>`;
      }).join("")}</tr>`).join("")}

    const bloques=horariosDe(k.id).slice().sort((a,b)=>a.ini<b.ini?-1:1);

  if(!tarea) return;
  const hijo=hijoDeEntrada(e);

  const args=argsEntrada(e);
  openModal(`<h3 style="margin-bottom:4px">${esc(tarea.icon)} ${esc(tarea.name)}</h3>

// =========================================================================
//  VISTA "LOS HIJOS" (Dashboard de los Papás)
//
//  Sustituye a la antigua pestaña de invitaciones, que ya no tiene sentido:
//  los tres perfiles están fijados y nadie se une ni se va.
//
//  Dos maneras de mirar lo mismo, que es lo que de verdad hace falta en casa:
//    - "Los tres" para comparar de un vistazo y ver quién va flojo,
//    - cada hijo por separado para entender POR QUÉ va flojo.
//
//  Qué hijo se está mirando es de este ordenador, no de la casa: por eso vive
//  en una variable suelta y no dentro de S. Si estuviera en S, abrir la ficha
//  de Pablo le cambiaría la pantalla a quien tuviera el panel abierto en otro
//  sitio.
// =========================================================================
let _deskHijo="todos";
function setDeskHijo(id){ _deskHijo=id; render(); }

function dHijos(){
  const kids=children();
  if(!kids.length) return '<div class="empty">No hay hijos configurados.</div>';
  const sel=kids.some(k=>k.id===_deskHijo)?_deskHijo:"todos";
  const tabs=[["todos","Todos"]].concat(kids.map(k=>[k.id,k.name]));
  const barra=`<div class="card" style="margin-bottom:18px"><div class="row">
    <div class="seg" style="flex:1;max-width:520px">
      ${tabs.map(([id,l])=>`<button class="${sel===id?"on":""}" onclick="setDeskHijo('${esc(id)}')">${esc(l)}</button>`).join("")}
    </div><span class="spacer"></span>
    <span class="dim" style="font-size:12px">${esc(monthName(S.currentMonth))}</span></div></div>`;
  return barra + (sel==="todos" ? dHijosComparativa(kids) : dHijoFicha(member(sel)));
}

// --- Visión conjunta ------------------------------------------------------
function dHijosComparativa(kids){
  const canjes=k=>redemptions().filter(c=>c.childId===k.id&&c.status==="pending").length;
  const porValidar=k=>
    S.extras.filter(x=>x.memberId===k.id&&x.status==="submitted").length +
    S.fixedTasks.filter(t=>!isDaily(t)).filter(t=>{const st=fixedStateOf(k.id,t.id);return st&&st.status==="submitted";}).length;

  return `
  <div class="cols-3" style="margin-bottom:20px">
    ${kids.map(k=>{const m=money(k.id), lv=levelOf(k.id), r=Math.round(m.ratio*100);
      return `<div class="card" style="border-top:4px solid ${escColor(k.color)}">
        <div class="row" style="margin-bottom:12px">
          <div class="avatar" style="width:42px;height:42px;font-size:18px;background:${escColor(k.color)}1f;color:${escColor(k.color)}">${esc(k.name[0]||"?")}</div>
          <div><div style="font-family:var(--num);font-weight:600;font-size:17px">${esc(k.name)}</div>
            <div class="dim" style="font-size:12px">Nivel ${lv.level} · ${lv.points} pts</div></div></div>
        <div class="row" style="gap:8px;flex-wrap:wrap;margin-bottom:12px">
          <span class="pill" style="background:rgba(255,194,75,.16);color:var(--amber)">🔥 ${S.streak[k.id]||0}</span>
          <span class="pill ${m.ratio>=1?"p-ok":m.ratio>=.75?"p-fixed":"p-late"}">${r}% fijas</span>
          ${porValidar(k)?`<span class="pill p-wait">${porValidar(k)} por validar</span>`:""}
          ${canjes(k)?`<span class="pill p-extra">${canjes(k)} premio(s)</span>`:""}
        </div>
        <div class="progress"><span style="width:${Math.min(100,r)}%;background:${m.ratio>=1?"var(--green)":m.ratio>=.75?"var(--cyan)":"var(--red)"}"></span></div>
        <div class="row" style="margin-top:14px"><span class="dim" style="font-size:13px">A entregar</span>
          <span class="spacer"></span><span class="num" style="font-size:21px;color:var(--accent-text)">${fmt(m.total)} €</span></div>
        <button class="btn w sm" style="margin-top:12px" onclick="setDeskHijo('${esc(k.id)}')">Ver su ficha</button>
      </div>`}).join("")}
  </div>

  <div class="cols">
    <div class="card">
      <h3 style="font-size:15px;margin-bottom:6px">Comparativa del mes</h3>
      <p class="dim" style="font-size:12px;margin-bottom:12px">Los mismos números para los tres, uno al lado del otro.</p>
      <table><thead><tr><th>Hijo/a</th><th>Fijas</th><th>Extras</th><th>Puntos</th><th>Racha</th><th>Total</th></tr></thead><tbody>
      ${kids.map(k=>{const m=money(k.id);
        return `<tr><td><b style="color:${escColor(k.color)}">${esc(k.name)}</b></td>
          <td class="num">${fixedApprovedUnits(k.id)}/${fixedTotalUnits(k.id)}</td>
          <td class="num">${extraPointsApproved(k.id)}/${extraPointsAssigned(k.id)}</td>
          <td class="num">${monthPoints(k.id)}</td>
          <td class="num">${S.streak[k.id]||0} d</td>
          <td class="num" style="color:var(--accent-text)">${fmt(m.total)} €</td></tr>`}).join("")}
      </tbody></table>
    </div>
    <div class="card">
      <h3 style="font-size:15px;margin-bottom:6px">Puntos disponibles para premios</h3>
      <p class="dim" style="font-size:12px;margin-bottom:12px">Los pedidos sin responder mantienen los puntos reservados.</p>
      ${kids.map(k=>{const total=monthPoints(k.id), res=pointsCommitted(k.id), libres=pointsAvailable(k.id);
        const pct=total?Math.round(libres/total*100):0;
        return `<div style="margin-bottom:16px">
          <div class="row" style="margin-bottom:6px"><b style="color:${escColor(k.color)}">${esc(k.name)}</b>
            <span class="spacer"></span><span class="num" style="font-size:13px">${libres} libres${res?` · ${res} reservados`:""}</span></div>
          <div class="progress"><span style="width:${pct}%;background:${escColor(k.color)}"></span></div>
        </div>`}).join("")}
    </div>
  </div>`;
}

// --- Ficha individual -----------------------------------------------------
function dHijoFicha(k){
  if(!k) return '<div class="empty">Ese hijo/a ya no existe.</div>';
  const m=money(k.id), lv=levelOf(k.id);
  const misExtras=S.extras.filter(x=>x.memberId===k.id);
  const misCanjes=redemptions().filter(c=>c.childId===k.id).slice().reverse().slice(0,6);
  const ETIQ={pending:"sin empezar",submitted:"por validar",approved:"aprobada",late:"vencida"};
  const CLASE={pending:"p-pending",submitted:"p-wait",approved:"p-ok",late:"p-late"};
  const ETIQ_C={pending:"pedido",approved:"concedido",denied:"denegado"};
  const CLASE_C={pending:"p-wait",approved:"p-ok",denied:"p-late"};

  return `
  <div class="kpis">
    <div class="kpi"><div class="k">A entregar</div><div class="v" style="color:var(--accent-text)">${fmt(m.total)}<small> €</small></div></div>
    <div class="kpi"><div class="k">Tareas fijas</div><div class="v">${Math.round(m.ratio*100)}<small>%</small></div></div>
    <div class="kpi"><div class="k">Puntos del mes</div><div class="v">${lv.points}<small> · Nv ${lv.level}</small></div></div>
    <div class="kpi"><div class="k">Racha</div><div class="v">${S.streak[k.id]||0}<small> días</small></div></div>
  </div>

  <div class="cols">
    <div class="card">
      <h3 style="font-size:15px;margin-bottom:6px">Semana de ${esc(k.name)}</h3>
      <p class="dim" style="font-size:12px;margin-bottom:14px">Las diarias las marca ${esc(k.name)} desde el móvil. Las semanales pasan por vosotros.</p>
      ${S.fixedTasks.map(t=>{
        const st=fixedStateOf(k.id,t.id)||{};
        if(isDaily(t)){
          const d=st.days||[false,false,false,false,false,false,false];
          return `<div class="task-line"><div class="tic">${esc(t.icon)}</div>
            <div style="flex:1"><b>${esc(t.name)}</b>
              <div class="dim" style="font-size:12px">${d.filter(Boolean).length}/7 días</div></div>
            <div style="display:flex;gap:4px">${d.map((on,i)=>`<span title="${DAYS[i]}" style="width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:11px;font-weight:800;font-family:var(--num);border:1.5px solid ${on?"var(--green)":"var(--line)"};background:${on?"var(--green)":"#fff"};color:${on?"#fff":"var(--faint)"}">${DAYLBL[i]}</span>`).join("")}</div></div>`;
        }
        const s=st.status||"pending";
        return `<div class="task-line"><div class="tic">${esc(t.icon)}</div>
          <div style="flex:1"><b>${esc(t.name)}</b><div class="dim" style="font-size:12px">semanal</div></div>
          <span class="pill ${CLASE[s]}">${ETIQ[s]}</span>
          ${s==="submitted"?`<button class="btn ok sm" onclick="setFixedStatus('${esc(k.id)}','${esc(t.id)}','approved')">Aprobar</button>`:""}</div>`;
      }).join("")||'<div class="empty">Sin tareas fijas.</div>'}
    </div>

    <div class="card">
      <h3 style="font-size:15px;margin-bottom:6px">Sus tareas adicionales</h3>
      <p class="dim" style="font-size:12px;margin-bottom:14px">${extraPointsApproved(k.id)} de ${extraPointsAssigned(k.id)} puntos aprobados.</p>
      ${misExtras.length?misExtras.map(x=>{const t=extraTask(x.taskId);
        return `<div class="task-line"><div class="tic">${esc(t.icon)}</div>
          <div style="flex:1"><b>${esc(t.name)}</b>
            <div class="dim" style="font-size:12px">${x.listed?"en el mercado":ETIQ[x.status]}</div></div>
          <span class="pts">${t.points}</span>
          ${x.status==="submitted"?`<button class="btn ok sm" onclick="setExtraStatus('${esc(x.id)}','approved')">Aprobar</button>`:`<span class="pill ${CLASE[x.status]}">${ETIQ[x.status]}</span>`}</div>`;
      }).join(""):'<div class="empty">Todavía no tiene tareas repartidas.</div>'}
    </div>
  </div>

  <div class="cols" style="margin-top:20px">
    <div class="card">
      <h3 style="font-size:15px;margin-bottom:6px">Premios que ha pedido</h3>
      <p class="dim" style="font-size:12px;margin-bottom:14px">Le quedan <b>${pointsAvailable(k.id)}</b> puntos libres${pointsCommitted(k.id)?` (${pointsCommitted(k.id)} reservados)`:""}.</p>
      ${misCanjes.length?misCanjes.map(c=>`<div class="task-line">
        <div style="flex:1"><b>${esc(rewardById(c.rewardId).title)}</b>
          <div class="dim" style="font-size:12px">${esc(fmtDate(c.at))} · ${c.cost} pts</div></div>
        ${c.status==="pending"
          ? `<button class="btn ok sm" onclick="resolveRedeem('${esc(c.id)}','approved')">Conceder</button>
             <button class="btn sm" onclick="resolveRedeem('${esc(c.id)}','denied')">Denegar</button>`
          : `<span class="pill ${CLASE_C[c.status]}">${ETIQ_C[c.status]}</span>`}</div>`).join("")
        :'<div class="empty">No ha pedido ningún premio.</div>'}
    </div>
    <div class="card">
      <h3 style="font-size:15px;margin-bottom:6px">Cuánta carga puede asumir</h3>
      <p class="dim" style="font-size:12px;margin-bottom:14px">Se usa al repartir las adicionales: quien tenga menos tiempo (exámenes, entrenamientos) recibe menos peso.</p>
      <div class="seg">${Object.keys(LOAD_LABEL).map(v=>`<button class="${k.load===v?"on":""}" onclick="setLoad('${esc(k.id)}','${v}')">${LOAD_LABEL[v]}</button>`).join("")}</div>
      <div class="sect-title" style="margin-top:20px">Historial</div>
      ${dHistorialHijo(k)}
    </div>
  </div>`;
}

// Meses ya cerrados. El servidor archiva un resumen por hijo al cambiar de mes.
function dHistorialHijo(k){
  const meses=Object.keys(S.history||{}).filter(Boolean).sort().reverse().slice(0,6);
  if(!meses.length) return '<div class="dim" style="font-size:13px">Todavía no hay meses cerrados.</div>';
  return `<table><thead><tr><th>Mes</th><th>Puntos</th><th>Hechas</th><th>Vencidas</th></tr></thead><tbody>
    ${meses.map(mes=>{const h=S.history[mes]||{};
      return `<tr><td>${esc(monthName(mes))}</td>
        <td class="num">${(h.points||{})[k.id]||0}</td>
        <td class="num">${(h.hechas||{})[k.id]||0}</td>
        <td class="num">${(h.vencidas||{})[k.id]||0}</td></tr>`}).join("")}
  </tbody></table>`;
}

function dHome(){
  const kids=children();
  const total=kids.reduce((s,k)=>s+money(k.id).total,0);
  const pendingVal=S.extras.filter(x=>x.status==="submitted").length+kids.reduce((s,k)=>s+S.fixedTasks.filter(t=>!isDaily(t)).filter(t=>{const st=fixedStateOf(k.id,t.id);return st&&st.status==="submitted";}).length,0);
  return `
  <div class="kpis">
    <div class="kpi"><div class="k">A entregar este mes</div><div class="v" style="color:var(--accent-text)">${fmt(total)}<small> €</small></div></div>
    <div class="kpi"><div class="k">Hijos</div><div class="v">${kids.length}</div></div>
    <div class="kpi"><div class="k">Por validar</div><div class="v">${pendingVal}</div></div>
    <div class="kpi"><div class="k">Tareas activas</div><div class="v">${S.fixedTasks.length}<small> fijas</small> · ${S.extraTasks.length}<small> extra</small></div></div>
  </div>
  ${!S.generated?`<div class="card" style="margin-bottom:20px"><div class="row"><div><h3 style="font-size:16px">Aún no has generado el mes</h3><p class="dim" style="font-size:13px;margin-top:4px">Reparte las tareas fijas y adicionales para empezar.</p></div><span class="spacer"></span><button class="btn primary" onclick="generateMonth()">Generar mes</button></div></div>`:""}
  <div class="cols">
    <div class="card">
      <h3 style="font-size:15px;margin-bottom:6px">Cuánto debes a cada hijo/a</h3>
      <p class="dim" style="font-size:12px;margin-bottom:12px">Fija si completa ≥75% · adicionales solo con el 100% de las fijas</p>
      <table><thead><tr><th>Hijo/a</th><th>Fijas</th><th>Fija €/sem</th><th>Extra €/mes</th><th>Total</th></tr></thead><tbody>
      ${kids.map(k=>{const m=money(k.id);const r=Math.round(m.ratio*100);
        return `<tr><td><b>${esc(k.name)}</b></td>
          <td><span class="chip" style="${m.ratio>=1?'color:var(--green)':m.ratio>=.75?'color:var(--cyan)':'color:var(--red)'}">${r}%</span></td>
          <td class="num">${fmt(m.fixedEarned)}</td>
          <td class="num">${m.canExtra?fmt(m.extraEarned):'<span class="dim">bloqueado</span>'}</td>
          <td class="num" style="color:var(--accent-text)">${fmt(m.total)} €</td></tr>`}).join("")}
      </tbody></table>
    </div>
    <div class="card">
      <h3 style="font-size:15px;margin-bottom:6px">Equilibrio de esfuerzo (adicionales)</h3>
      <p class="dim" style="font-size:12px;margin-bottom:4px">Se reparte el peso, no el número de tareas.</p>
      <div class="bal">${kids.map(k=>{const p=extraPointsAssigned(k.id);const max=Math.max(1,...kids.map(c=>extraPointsAssigned(c.id)));
        return `<div class="col"><div class="bar" style="height:${30+p/max*70}%;background:linear-gradient(180deg,${escColor(k.color)},${escColor(k.color)}88)"><span class="v">${p}</span></div><span class="nm">${esc(k.name)}</span></div>`}).join("")}</div>
    </div>
  </div>
  ${marketActivityCard()}`;
}

// Tarjeta de transparencia: qué se ha movido en el mercado entre hermanos.
function marketActivityCard(){
  const open=S.listings.filter(l=>l.status==="open");
  const log=S.marketLog.slice(-6).reverse();
  if(!open.length && !log.length) return "";
  const t=id=>extraTask(id);
  return `<div class="card" style="margin-top:20px">
    <h3 style="font-size:15px;margin-bottom:4px">Mercado de tareas entre hermanos</h3>
    <p class="dim" style="font-size:12px;margin-bottom:12px">Solo lectura. Los hijos se organizan; tú validas igualmente quién hace cada tarea.</p>
    ${open.length?`<div class="sect-title">En venta ahora</div>
      ${open.map(l=>`<div class="task-line"><div class="tic">${esc(t(l.taskId).icon)}</div><div style="flex:1"><b>${esc(t(l.taskId).name)}</b><div class="dim" style="font-size:12px">${esc(member(l.sellerId).name)}${l.pointsOffered>0?` · ofrece ${l.pointsOffered} pts`:""}${l.acceptsTrade?" · acepta trueque":""}</div></div><span class="chip p-extra">${t(l.taskId).points} pts</span></div>`).join("")}`:""}
    ${log.length?`<div class="sect-title" style="margin-top:14px">Operaciones recientes</div>
      ${log.map(m=>{const desc=m.kind==="take"
        ?`${esc(member(m.to).name)} se quedó <b>${esc(t(m.taskId).name)}</b> de ${esc(member(m.from).name)}${m.points>0?` (+${m.points} pts)`:""}`
        :`${esc(member(m.from).name)} ↔ ${esc(member(m.to).name)}: <b>${esc(t(m.taskId).name)}</b> por <b>${m.giveTaskId?esc(t(m.giveTaskId).name):"—"}</b>${m.points>0?` (+${m.points} pts)`:""}`;
        return `<div class="task-line"><div style="flex:1;font-size:13px">${desc}</div></div>`}).join("")}`:""}
  </div>`;
}

function dFixed(){
  return `<div class="card" style="margin-bottom:18px"><div class="row">
    <div><h3 style="font-size:15px">Lista común de tareas fijas</h3><p class="dim" style="font-size:13px;margin-top:4px">Las mismas para todos los hijos. Base de la paga fija (${fmt(S.fixedPay)} €/semana al completar ≥75%). Marca cada tarea como diaria o semanal.</p></div>
    <span class="spacer"></span><button class="btn primary sm" onclick="modalAddFixed()">+ Añadir</button></div></div>
  <div class="card">${S.fixedTasks.map(t=>`<div class="task-line"><div class="tic">${esc(t.icon)}</div>
    <div style="flex:1"><b>${esc(t.name)}</b><div class="dim" style="font-size:12px">${isDaily(t)?"Cada día · 7 por semana":"Una vez por semana"}</div></div>
    <div class="seg" style="width:180px;flex:none">
      <button class="${isDaily(t)?"on":""}" onclick="setFixedFreq('${t.id}','daily')">Diaria</button>
      <button class="${!isDaily(t)?"on":""}" onclick="setFixedFreq('${t.id}','weekly')">Semanal</button>
    </div>
    <button class="btn ghost sm" style="color:var(--red)" onclick="delFixed('${t.id}')" aria-label="Borrar tarea fija" title="Borrar tarea fija">✕</button></div>`).join("")||'<div class="empty">Sin tareas fijas.</div>'}</div>`;
}

function dExtra(){
  return `<div class="card" style="margin-bottom:18px"><div class="row">
    <div><h3 style="font-size:15px">Tareas adicionales</h3><p class="dim" style="font-size:13px;margin-top:4px">Dan dinero extra (puntos × ${S.rate} €). Se reparten por peso entre los hijos.</p></div>
    <span class="spacer"></span><button class="btn primary sm" onclick="modalAddExtra()">+ Añadir</button></div></div>
  <div class="cols">
    <div class="card"><h3 style="font-size:14px;margin-bottom:12px">Catálogo</h3>
      ${S.extraTasks.map(t=>`<div class="task-line"><div class="tic">${esc(t.icon)}</div><div style="flex:1"><b>${esc(t.name)}</b></div><span class="pts">${t.points}</span><button class="btn ghost sm" style="color:var(--red)" onclick="delExtra('${t.id}')" aria-label="Borrar tarea adicional" title="Borrar tarea adicional">✕</button></div>`).join("")}
    </div>
    <div class="card"><div class="row" style="margin-bottom:12px"><h3 style="font-size:14px">Reparto actual</h3><span class="spacer"></span><button class="btn sm" onclick="generateMonth()">${S.generated?"Volver a repartir":"Generar"}</button></div>
      ${S.generated?children().map(k=>{const list=S.extras.filter(x=>x.memberId===k.id);
        return `<div style="margin-bottom:14px"><div class="row" style="margin-bottom:6px"><b style="color:${escColor(k.color)}">${esc(k.name)}</b><span class="spacer"></span><span class="pts">${extraPointsAssigned(k.id)} pts</span></div>
        ${list.map(x=>{const t=extraTask(x.taskId);return `<div class="row" style="font-size:13px;padding:4px 0"><span>${esc(t.icon)} ${esc(t.name)}</span><span class="spacer"></span><span class="dim num">${t.points}</span></div>`}).join("")}</div>`}).join(""):'<div class="empty">Genera el mes para ver el reparto.</div>'}
    </div>
  </div>`;
}

function dValidate(){
  const rows=[];
  children().forEach(k=>{
    S.fixedTasks.filter(t=>!isDaily(t)).forEach(t=>{ const st=fixedStateOf(k.id,t.id);
      if(st && (st.status==="submitted"||st.status==="pending")) rows.push({kind:"fixed",childId:k.id,taskId:t.id,status:st.status}); });
  });
  S.extras.forEach(x=>{ if(x.status==="submitted"||x.status==="pending") rows.push({kind:"extra",id:x.id,childId:x.memberId,taskId:x.taskId,status:x.status}); });
  const note=`<p class="dim" style="font-size:13px;margin-bottom:16px">Las tareas <b>diarias</b> (hacer la cama, etc.) las marcan los hijos día a día y no necesitan tu validación. Aquí solo aparecen las <b>semanales</b> y las <b>adicionales</b>.</p>`;
  if(!rows.length) return note+`<div class="empty">Nada pendiente de validar.</div>`;
  return note+`<div class="card"><table><thead><tr><th>Tarea</th><th>Hijo/a</th><th>Tipo</th><th>Estado</th><th></th></tr></thead><tbody>
    ${rows.map(r=>{const t=r.kind==="fixed"?fixedTask(r.taskId):extraTask(r.taskId);
      const act=r.status==="submitted"
        ? (r.kind==="fixed"
            ? `<button class="btn ok sm" onclick="setFixedStatus('${r.childId}','${r.taskId}','approved')">Aprobar</button> <button class="btn sm" onclick="setFixedStatus('${r.childId}','${r.taskId}','pending')">Rechazar</button>`
            : `<button class="btn ok sm" onclick="setExtraStatus('${r.id}','approved')">Aprobar</button> <button class="btn sm" onclick="setExtraStatus('${r.id}','pending')">Rechazar</button>`)
        : (r.kind==="fixed"
            ? `<button class="btn sm" onclick="setFixedStatus('${r.childId}','${r.taskId}','late')">Marcar vencida</button>`
            : `<button class="btn sm" onclick="setExtraStatus('${r.id}','late')">Marcar vencida</button>`);
      return `<tr><td>${esc(t.icon)} ${esc(t.name)}</td><td>${esc(member(r.childId).name)}</td><td><span class="chip ${r.kind==="fixed"?"p-fixed":"p-extra"}">${r.kind==="fixed"?"semanal":"extra "+t.points}</span></td>
        <td>${r.status==="submitted"?'<span class="pill p-wait">por validar</span>':'<span class="pill p-pending">sin empezar</span>'}</td><td style="text-align:right">${act}</td></tr>`}).join("")}
  </tbody></table></div>`;
}

// ---- Ajustes de la casa: acceso, avisos y copias ------------------------------
// Se cargan del servidor aparte del estado (no viajan en él). Una sola petición
// a la vez, y al terminar se repinta en silencio.
let _casa={cargando:false, cargada:false, protegida:null, avisos:{}, copias:[], copiasError:false};
async function cargarInfoCasa(forzar){
  if(_casa.cargando || (_casa.cargada && !forzar)) return;
  _casa.cargando=true;
  try{
    const [salud, avisos, copias]=await Promise.all([
      api("/api/health").catch(()=>({})),
      api("/api/push/estado").catch(()=>({})),
      api("/api/copias").catch(()=>null),
    ]);
    _casa.protegida = typeof salud.protegida==="boolean" ? salud.protegida : null;
    _casa.avisos = (avisos && avisos.suscripciones) || {};
    _casa.copias = (copias && copias.copias) || [];
    _casa.copiasError = !copias;
  } finally {
    _casa.cargando=false; _casa.cargada=true;
    if(S && S.view==="desk") render({quiet:true});
  }
}
