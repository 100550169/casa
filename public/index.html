// Tras restaurar o reiniciar: se trae el estado nuevo sin perder qué pestaña
// tenía abierta este dispositivo.
async function recargarEstado(){
  const local={view:S.view,profile:S.profile,deskTab:S.deskTab,mobTab:S.mobTab};
  S=Object.assign(await api("/api/state"),local);
  ensureShape(); marcarBase();
  await cargarInfoCasa(true);
  render();
}
async function restaurarCopia(id,dia){
  if(window.__DEMO__){ alert("En la demo no se restauran copias."); return; }
  if(!confirm("¿Volver la casa a como estaba el "+dia+"?\n\nLo de ahora se guarda antes como copia: se puede deshacer.")) return;
  try{
    await api("/api/copias/"+Number(id)+"/restaurar",{method:"POST"});
    await recargarEstado();
    alert("Hecho. La casa está como el "+dia+".");
  }catch(e){ if(e.status!==401) alert("No se pudo restaurar. Inténtalo de nuevo."); }
}

// Descarga una copia del estado actual. Va por fetch y no por un enlace normal
// porque tiene que llevar el código de casa en la cabecera.
async function downloadBackup(){
  if(window.__DEMO__){ alert("En la demo no se descargan copias."); return; }
  try{
    const r=await fetch("/api/backup",{headers:cabecerasApi()});
    if(r.status===401){ pedirCodigoCasa(); return; }
    if(!r.ok) throw new Error("http_"+r.status);
    const url=URL.createObjectURL(await r.blob());
    const a=document.createElement("a");
    a.href=url; a.download="casa-copia-"+new Date().toISOString().slice(0,10)+".json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),2000);
  }catch(e){ alert("No se pudo descargar la copia. Inténtalo de nuevo."); }
}
// Restaura el estado desde un archivo de copia elegido por el usuario.
function restoreBackup(input){
  const file=input.files && input.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=async()=>{
    let data;
    try{ data=JSON.parse(reader.result); }catch(e){ alert("El archivo no es una copia válida."); return; }
    if(!data || !Array.isArray(data.members)){ alert("El archivo no parece una copia de esta app."); return; }
    if(!confirm("Esto reemplazará TODOS los datos actuales por los de la copia (lo de ahora se guarda antes como copia). ¿Continuar?")){ input.value=""; return; }
    try{
      await api("/api/restore",{method:"POST",body:data});
      // Se recarga del servidor: la copia llega saneada y con el ciclo actual,
      // y así S trae su versión (si no, el siguiente guardado iría a ciegas).
      await recargarEstado();
      alert("Copia restaurada correctamente.");
    }catch(e){ if(e.status!==401) alert("No se pudo restaurar. Inténtalo de nuevo."); }
    input.value="";
  };
  reader.readAsText(file);
}

// Tareas de un hijo en un día, agrupadas por franja.
function franjasDelDia(items){
  return FRANJAS.map(f=>{
    const its=items.filter(it=>it.e.slot===f.id);
    if(!its.length) return "";
    return `<div class="sem-fr"><div class="sem-fr-h">${f.ico} ${f.label}</div>${its.map(itemAgendaMob).join("")}</div>`;
  }).join("");
}

// Lo primero que ve un hijo al abrir: qué le toca hoy. Si no hay nada
// planificado para hoy, la tarjeta no aparece.
function tarjetaHoy(childId){
  const hoy=todayIdx();
  const mias=itemsAgenda().filter(it=>it.hijo===childId && it.e.day===hoy);
  if(!mias.length) return "";
  const pendientes=mias.filter(it=>!it.hecha).length;
  return `<div class="mcard hoy-card">
    <div class="row" style="margin-bottom:8px"><b>📅 Hoy te toca</b><span class="spacer"></span>
      <span class="pill ${pendientes?"p-wait":"p-ok"}">${pendientes?pendientes+" pendiente"+(pendientes>1?"s":""):"todo hecho ✓"}</span></div>
    ${franjasDelDia(mias)}
  </div>`;
}

function mSemana(){
  const me=member(S.profile);
  const hoy=todayIdx();
  const mias=itemsAgenda().filter(it=>it.hijo===me.id);
  const diarias=(S.fixedTasks||[]).filter(isDaily);
  let html=`<p class="dim" style="font-size:13px;margin:0 4px 14px">Tu semana, organizada por tus papás según tus horarios.</p>`;
  if(diarias.length) html+=`<div class="mcard"><b style="font-size:14px">Todos los días</b>
    <div class="sem-diarias">${diarias.map(t=>`<span class="chip">${esc(t.icon)} ${esc(t.name)}</span>`).join("")}</div></div>`;
  if(!mias.length) html+=`<div class="empty" style="padding:18px 10px">Tus papás aún no han organizado la semana.</div>`;
  DAYS.forEach((d,i)=>{
    const delDia=mias.filter(it=>it.e.day===i);
    const bloques=bloquesDe(me.id,i).slice().sort((a,b)=>a.ini<b.ini?-1:1);
    const resumen=delDia.length?delDia.length+" tarea"+(delDia.length>1?"s":""):"libre";
    html+=`<details class="sem-dia${i===hoy?" hoy":""}"${i===hoy?" open":""}>

      ${delDia.length?franjasDelDia(delDia):'<div class="dim" style="font-size:13px;padding:6px 0 2px">Sin tareas este día.</div>'}
    </details>`;
  });
  return html;
}
// Tarjeta de tarea fija en el móvil: diaria (7 casillas) o semanal (validación)
function fixedCardMob(t,meId){
  const st=fixedStateOf(meId,t.id)||{};
  if(isDaily(t)){
    const days=st.days||[false,false,false,false,false,false,false];
    const ti=todayIdx(); const done=days.filter(Boolean).length;
    return `<div class="mcard"><div class="row" style="margin-bottom:10px">
      <div class="tic" style="width:38px;height:38px;font-size:17px">${esc(t.icon)}</div>
      <div style="flex:1"><b>${esc(t.name)}</b><div class="dim" style="font-size:11px">Diaria · ${done}/7 días${done===7?' ✓':''}</div></div></div>
      <div style="display:flex;gap:6px">${days.map((d,i)=>`<button onclick="toggleFixedDay('${meId}','${t.id}',${i})" aria-pressed="${d}" aria-label="${esc(t.name)}, ${DIAS_LARGOS[i]}" style="flex:1;aspect-ratio:1;border-radius:11px;border:1.5px solid ${d?'var(--green)':'var(--line)'};background:${d?'var(--green)':'#fff'};color:${d?'#fff':'var(--dim)'};font-weight:800;font-size:12px;font-family:var(--num);${i===ti?'box-shadow:0 0 0 2.5px var(--accent)':''}">${DAYLBL[i]}</button>`).join("")}</div>
    </div>`;
  }
  // Semanal: pasa por validación del padre
  const status=st.status||"pending";
  const lbl={pending:"Toca a ti",submitted:"Esperando visto bueno",approved:"Hecha ✓",late:"Vencida"}[status];
  const cls={pending:"p-pending",submitted:"p-wait",approved:"p-ok",late:"p-late"}[status];
  return `<div class="task ${status==="approved"?"approved":""}"><div class="tic" style="width:40px;height:40px;border-radius:11px;background:var(--card2);display:grid;place-items:center;font-size:18px">${esc(t.icon)}</div>
    <div style="flex:1"><div class="tname">${esc(t.name)}</div><div class="tsub"><span class="pill p-fixed" style="margin-right:5px">semanal</span><span class="pill ${cls}">${lbl}</span></div></div>
    <div style="text-align:right">${status==="pending"?`<button class="btn ok sm" onclick="setFixedStatus('${meId}','${t.id}','submitted')">Hecha</button>`:""}</div></div>`;
}
// Fila de tarea fija (no afectada por el mercado)
function taskRowMob(t,status,onMark,kind){

// Fila de tarea adicional (puede estar en venta o tener prima de mercado)
function extraRowMob(x,meId){
  const t=extraTask(x.taskId);
  const lbl={pending:"Toca a ti",submitted:"Esperando visto bueno",approved:"Aprobada ✓",late:"Vencida"}[x.status];
  const cls={pending:"p-pending",submitted:"p-wait",approved:"p-ok",late:"p-late"}[x.status];
  // Prima de mercado pactada sobre esta tarea
  let bounty="";
  if(x.bounty){
    if(x.bounty.to===meId) bounty=`<div class="dim" style="font-size:11px;color:var(--green)">+${x.bounty.points} pts de mercado</div>`;
    else if(x.bounty.from===meId) bounty=`<div class="dim" style="font-size:11px;color:var(--red)">−${x.bounty.points} pts de mercado</div>`;
  }
  return `<div class="task ${x.status==="approved"?"approved":""}"><div class="tic" style="width:40px;height:40px;border-radius:11px;background:var(--card2);display:grid;place-items:center;font-size:18px">${esc(t.icon)}</div>
    <div style="flex:1"><div class="tname">${esc(t.name)}</div>
      <div class="tsub">${x.listed?`<span class="pill p-extra">🏷️ en el mercado</span>`:`<span class="pill ${cls}">${lbl}</span>`}</div>${bounty}</div>
    <div style="text-align:right"><div class="pts">+${t.points}</div>
    ${x.status==="pending"&&!x.listed?`<button class="btn ok sm" style="margin-top:6px" onclick="setExtraStatus('${x.id}','submitted')">Hecha</button>`:""}
    ${x.listed?`<button class="btn ghost sm" style="margin-top:6px;color:var(--red)" onclick="cancelListingByAssignment('${x.id}')">Retirar</button>`:""}</div></div>`;
}
// Atajo: retirar del mercado desde la pantalla de inicio

// ===================== VISTA MERCADO (HIJO) =====================
function mMarket(){
  const me=member(S.profile);
  if(!S.generated) return `<div class="empty">El mes aún no está repartido.<br>Cuando tus padres asignen las tareas adicionales, podrás venderlas o cambiarlas aquí.</div>`;

  const sellable=S.extras.filter(x=>x.memberId===me.id && x.status==="pending" && !x.listed);
  const myListings=S.listings.filter(l=>l.sellerId===me.id && l.status==="open");
  const incoming=S.offers.filter(o=>o.status==="pending" && S.listings.some(l=>l.id===o.listingId && l.sellerId===me.id && l.status==="open"));
  const board=S.listings.filter(l=>l.status==="open" && l.sellerId!==me.id);
  const log=S.marketLog.slice(-6).reverse();
  const t=id=>extraTask(id);

  let html=`<p class="dim" style="font-size:13px;margin:0 4px 16px">Vende una tarea ofreciendo puntos a quien la haga, o cámbiala por otra. Os organizáis entre vosotros.</p>`;

  // --- Solicitudes recibidas (te piden una tarea o te ofrecen un cambio) ---
  if(incoming.length){
    html+=`<div class="sect-title">📥 Te han pedido algo (${incoming.length})</div>`;
    incoming.forEach(o=>{
      const l=S.listings.find(x=>x.id===o.listingId);
      const quien=esc(member(o.bidderId).name);
      const esTake=o.kind==="take";
      html+=`<div class="mcard" style="border-color:${esTake?"var(--accent)":"var(--violet)"}">
        <div class="row"><span class="pill ${esTake?"p-wait":"p-extra"}">${esTake?"te la pide":"trueque"}</span>
          <span class="spacer"></span><span class="dim" style="font-size:12px">de ${quien}</span></div>
        <div style="margin:10px 0;font-size:14px;font-weight:700">${quien} hará tu <b>${esc(t(l.taskId).icon)} ${esc(t(l.taskId).name)}</b></div>
        ${esTake
          ? (l.pointsOffered>0
              ? `<div class="row" style="font-size:13px"><span class="dim">Le darás</span><span class="spacer"></span><span class="pts">${l.pointsOffered} pts</span></div>`
              : `<div class="dim" style="font-size:13px">Sin puntos de por medio.</div>`)
          : `<div class="row" style="font-size:13px"><span class="dim">A cambio tú harás:</span><span class="spacer"></span><span>${esc(t(o.offeredTaskId).icon)} ${esc(t(o.offeredTaskId).name)} <span class="pts">${t(o.offeredTaskId).points}</span></span></div>
             ${o.pointsAsked>0?`<div class="row" style="font-size:13px;margin-top:6px"><span class="dim">Te pide además:</span><span class="spacer"></span><span class="pts">${o.pointsAsked} pts</span></div>`:""}`}
        <div class="row" style="gap:8px;margin-top:12px">
          <button class="btn ok sm" style="flex:1" onclick="acceptOffer('${esc(o.id)}')">Aceptar</button>
          <button class="btn sm" style="flex:1" onclick="rejectOffer('${esc(o.id)}')">Rechazar</button>
        </div></div>`;
    });
  }

  // --- Mis anuncios activos ---
  if(myListings.length){
    html+=`<div class="sect-title" style="margin-top:18px">🏷️ Tus anuncios</div>`;
    myListings.forEach(l=>{
      const offs=S.offers.filter(o=>o.listingId===l.id && o.status==="pending");
      html+=`<div class="mcard"><div class="row">
        <div class="tic" style="width:38px;height:38px;font-size:17px">${esc(t(l.taskId).icon)}</div>
        <div style="flex:1"><div style="font-weight:800">${esc(t(l.taskId).name)}</div>
          <div class="dim" style="font-size:12px">${l.pointsOffered>0?`Ofreces ${l.pointsOffered} pts`:""}${l.pointsOffered>0&&l.acceptsTrade?" · ":""}${l.acceptsTrade?"Acepta trueque":""}</div></div>
        <span class="pts">${t(l.taskId).points}</span></div>
        <div class="row" style="margin-top:10px"><span class="dim" style="font-size:12px">${offs.length?offs.length+" oferta(s) de trueque":"Aún sin ofertas"}</span>
        <span class="spacer"></span><button class="btn ghost sm" style="color:var(--red)" onclick="cancelListing('${l.id}')">Retirar</button></div></div>`;
    });
  }

  // --- Tablón de anuncios de los hermanos ---
  html+=`<div class="sect-title" style="margin-top:18px">🛒 Tablón de la familia</div>`;
  if(!board.length){
    html+=`<div class="empty" style="padding:18px">Nadie ha puesto tareas ahora mismo.</div>`;
  }else{
    board.forEach(l=>{
      html+=`<div class="mcard"><div class="row">
        <div class="tic" style="width:42px;height:42px;font-size:19px">${esc(t(l.taskId).icon)}</div>
        <div style="flex:1"><div style="font-weight:800">${esc(t(l.taskId).name)}</div>
          <div class="dim" style="font-size:12px">de ${esc(member(l.sellerId).name)} · esfuerzo ${t(l.taskId).points}</div></div>
        ${l.pointsOffered>0?`<div style="text-align:right"><div class="pts">+${l.pointsOffered}</div><div class="dim" style="font-size:11px">pts extra</div></div>`:""}</div>
        ${l.note?`<div class="dim" style="font-size:12px;margin-top:8px;font-style:italic">"${esc(l.note)}"</div>`:""}
        <div class="row" style="gap:8px;margin-top:12px">
          ${yaPedida(l.id)
            ? `<button class="btn sm" style="flex:1" disabled>Ya se la has pedido</button>`
            : `<button class="btn primary sm" style="flex:1" onclick="confirmTake('${esc(l.id)}')">Pedírsela${l.pointsOffered>0?` (+${l.pointsOffered})`:""}</button>`}
          ${l.acceptsTrade?`<button class="btn sm" style="flex:1" onclick="sheetTrade('${l.id}')">Ofrecer trueque</button>`:""}
        </div></div>`;
    });
  }

  // --- Mis tareas para poner en venta ---
  html+=`<div class="sect-title" style="margin-top:18px">📦 Tus tareas adicionales</div>`;
  if(!sellable.length){
    html+=`<div class="empty" style="padding:18px">No tienes tareas adicionales libres para vender.</div>`;
  }else{
    sellable.forEach(x=>{
      html+=`<div class="task"><div class="tic" style="width:40px;height:40px;font-size:18px">${esc(t(x.taskId).icon)}</div>
        <div style="flex:1"><div class="tname">${esc(t(x.taskId).name)}</div><div class="tsub">${t(x.taskId).points} pts de esfuerzo</div></div>
        <button class="btn sm" onclick="sheetPublish('${x.id}')">Vender / cambiar</button></div>`;
    });
  }

  // --- Historial ---
  if(log.length){
    html+=`<div class="sect-title" style="margin-top:18px">🧾 Movimientos recientes</div>`;
    log.forEach(m=>{
      const desc = m.kind==="take"
        ? `${esc(member(m.to).name)} se quedó <b>${esc(t(m.taskId).icon)} ${esc(t(m.taskId).name)}</b> de ${esc(member(m.from).name)}${m.points>0?` (+${m.points} pts)`:""}`
        : `${esc(member(m.from).name)} y ${esc(member(m.to).name)} cambiaron <b>${esc(t(m.taskId).icon)}</b> ↔ <b>${m.giveTaskId?t(m.giveTaskId).icon:""}</b>${m.points>0?` (+${m.points} pts)`:""}`;
      html+=`<div class="mcard" style="padding:11px 14px"><div style="font-size:13px">${desc}</div></div>`;
    });
  }

  return html;
}

    <p class="dim" style="font-size:13px;margin-bottom:18px">Los puntos se te reservan ahora. Cuando tus padres lo aprueben, se descontarán; si lo deniegan, los recuperas.</p>

// El hijo pide el premio: se crea la solicitud y los puntos quedan reservados.
function doRedeem(rewardId){
  const r=rewardById(rewardId); if(!r.id) return;
  const me=member(S.profile);
  if(!rewardAvailable(r)){ alert("Ese premio ya no está disponible."); closeSheet(); render(); return; }
  if(pointsAvailable(me.id)<r.cost){ alert("No te llegan los puntos."); closeSheet(); render(); return; }
  redemptions().push({id:uid("c"), rewardId, childId:me.id, cost:r.cost, status:"pending", at:Date.now(), resolvedAt:0});
  save(); closeSheet(); render();
}
function cancelRedeem(id){
  const c=redemptions().find(x=>x.id===id);
  if(!c || c.status!=="pending") return;
  if(!confirm("¿Cancelar la solicitud? Recuperas los puntos.")) return;
  S.redemptions=redemptions().filter(x=>x.id!==id);
  save(); render();
}

// ============== ARRANQUE: elegir perfil → app ==============
//
// No hay inicio de sesión. Al abrir, la app pregunta quién eres (o lo recuerda
// de la última vez) y entra directamente en tu pantalla.
//
// PERFIL guarda quién está usando ESTE dispositivo. Es de este navegador y no
// viaja dentro del estado compartido: si viajara, cambiar de perfil en el móvil
// de Sara le cambiaría la pantalla a todos los demás.
const PERFIL_KEY="casa_perfil_v1";
let PERFIL=null;

function perfilActual(){
  if(PERFIL) return PERFIL;
  try{
    const guardado=localStorage.getItem(PERFIL_KEY);
    if(esPerfilValido(guardado)) PERFIL=guardado;
  }catch(e){}
  return PERFIL;
}
function recordarPerfil(id){
  PERFIL=id;
  try{ localStorage.setItem(PERFIL_KEY,id); }catch(e){}
}
function olvidarPerfil(){
  PERFIL=null;
  try{ localStorage.removeItem(PERFIL_KEY); }catch(e){}
}
// Datos del perfil abierto ahora mismo (nombre, color, emoji…).
const perfilInfo=()=>perfilPorId(perfilActual())||PAPAS;

// ============== CÓDIGO DE CASA ==============
//
// La llave de la casa. Los papás mandan a cada móvil un enlace que lo lleva
// (https://…/#casa=ABCD-EFGH-JKMN); el móvil lo guarda y lo envía solo en cada
// petición. Va detrás de "#" a propósito: esa parte de la dirección nunca sale
// del navegador, así que no queda en los registros de ningún servidor.
//
// En iPhone, la app añadida a la pantalla de inicio guarda sus datos aparte de
// Safari: ahí no llega lo del enlace y la app pide el código una vez.
const CODIGO_KEY="casa_codigo_v1";
let CODIGO=null;
function codigoCasa(){
  if(CODIGO!==null) return CODIGO;
  try{ CODIGO=localStorage.getItem(CODIGO_KEY)||""; }catch(e){ CODIGO=""; }
  return CODIGO;
}
function guardarCodigoCasa(c){
  CODIGO=String(c||"").trim();
  try{ localStorage.setItem(CODIGO_KEY,CODIGO); }catch(e){}
}
function leerCodigoDeEnlace(hash){
  const m=/(?:^|[#&])casa=([A-Za-z0-9%\- ]{4,80})/.exec(hash||"");
  if(!m) return "";
  try{ return decodeURIComponent(m[1]).trim(); }catch(e){ return ""; }
}
function adoptarCodigoDelEnlace(){
  const c=leerCodigoDeEnlace(location.hash);
  if(!c) return;
  guardarCodigoCasa(c);
  // Fuera de la barra de direcciones: que no salga en una captura de pantalla
  // ni viaje si alguien comparte la página.
  try{ history.replaceState(null,"",location.pathname+location.search); }catch(e){}
}
const enlaceParaDispositivo=()=>location.origin+"/#casa="+encodeURIComponent(codigoCasa());

function pedirCodigoCasa(error){
  clearInterval(_poll);
  closeSheet(); closeModal();
  $("desk").style.display="none";
  $("mob").style.display="none";
  $("modebar").style.display="none";
  $("picker").style.display="block";
  $("picker").innerHTML=`<div class="pick-shell"><div class="pick-card" style="max-width:440px">
    <div class="pick-brand"><span class="dot">🔒</span>
      <div><h1>Casa</h1><div class="sub">Esta casa es privada</div></div></div>
    ${error?`<div class="pick-err">${esc(error)}</div>`:""}
    <div class="card">
      <p style="font-size:14px;margin:0 0 14px">Escribe el <b>código de casa</b>. Te lo dan tus papás (o abre el enlace que te hayan mandado).</p>
      <div class="field"><label for="codigoInput">Código de casa</label>
        <input id="codigoInput" autocomplete="off" autocapitalize="characters" spellcheck="false"
          placeholder="XXXX-XXXX-XXXX" onkeydown="if(event.key==='Enter')enviarCodigoCasa()"></div>
      <button class="btn primary w" onclick="enviarCodigoCasa()">Entrar</button>
    </div>
    <p class="pick-note">Solo se pide una vez en cada móvil.</p>
  </div></div>`;
}
async function enviarCodigoCasa(){
  const v=(($("codigoInput")||{}).value||"").trim();
  if(!v) return pedirCodigoCasa("Escribe el código.");
  guardarCodigoCasa(v);
  try{
    const estado=await api("/api/state");
    await arrancarCon(estado);
  }catch(e){
    if(e.status===401) pedirCodigoCasa("Ese código no es el de esta casa. Revísalo.");
    else if(e.status===429) pedirCodigoCasa("Demasiados intentos seguidos. Espera unos minutos.");
    else pedirCodigoCasa("No se pudo comprobar. ¿Hay conexión?");
  }
}

async function bootstrap(){
  clearInterval(_poll);
  adoptarCodigoDelEnlace();
  // Se pregunta al servidor ANTES de enseñar el selector: si la casa pide
  // código y este móvil no lo tiene, lo primero que hay que ver es eso, no
  // cuatro botones que luego no llevan a ningún sitio.
  let estado=null;
  try{ estado=await api("/api/state"); }
  catch(e){
    if(e.status===401) return;                      // api() ya ha pedido el código
    if(e.status===429) return pedirCodigoCasa("Demasiados intentos seguidos. Espera unos minutos.");
    // Sin conexión: se sigue, y abrirPerfil enseñará el error si no se puede.
  }
  await arrancarCon(estado);
}
async function arrancarCon(estado){
  if(!perfilActual()) return mostrarSelector();
  await abrirPerfil(perfilActual(), estado);
}

// ============== AVISOS EN EL MÓVIL ==============
//
// En iPhone solo funcionan con la app añadida a la pantalla de inicio (iOS
// 16.4 o posterior); en un Safari normal ni siquiera existen. El permiso se
// pide SIEMPRE desde un botón: iOS ignora la petición si no la provoca un
// toque del usuario.
const AVISOS_CERRADO_KEY="casa_avisos_tarjeta_cerrada_v1";
let _avisos="desconocido";   // demo | instalar | no-soportado | denegado | activos | inactivos
const esIOS=()=>/iPad|iPhone|iPod/.test(navigator.userAgent||"")||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
const esAppInstalada=()=>navigator.standalone===true||!!(window.matchMedia&&matchMedia("(display-mode: standalone)").matches);
const soportaAvisos=()=>"serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
// navigator.serviceWorker.ready no termina nunca si el service worker no se
// pudo instalar: se le pone un límite para no dejar la pantalla esperando.
const swListo=()=>Promise.race([navigator.serviceWorker.ready,new Promise((_,mal)=>setTimeout(()=>mal(new Error("sin_service_worker")),5000))]);
async function suscripcionActual(){
  try{ return await (await swListo()).pushManager.getSubscription(); }catch(e){ return null; }
}

async function comprobarAvisos(){
  let estado;
  if(window.__DEMO__) estado="demo";
  else if(!soportaAvisos()) estado=esIOS()&&!esAppInstalada()?"instalar":"no-soportado";
  else if(Notification.permission==="denied") estado="denegado";
  else estado=(Notification.permission==="granted" && await suscripcionActual())?"activos":"inactivos";
  if(estado!==_avisos){
    _avisos=estado;
    document.querySelectorAll(".avisos-bloque").forEach(el=>{ el.innerHTML=bloqueAvisos(); });
    if(S && $("picker").style.display!=="block") render({quiet:true});
  }
  return estado;
}

function base64UrlABytes(b64){
  const s=(b64+"=".repeat((4-b64.length%4)%4)).replace(/-/g,"+").replace(/_/g,"/");
  return Uint8Array.from(atob(s),c=>c.charCodeAt(0));
}

async function activarAvisos(){
  if(_avisos==="instalar"){ alert(TEXTO_INSTALAR); return; }
  if(!soportaAvisos()){ alert("Este navegador no admite avisos."); return; }
  try{
    // Lo primero, sin esperar a nada: iOS solo acepta la petición de permiso
    // si sale directamente del toque en el botón.
    const permiso=await Notification.requestPermission();
    if(permiso!=="granted"){
      await comprobarAvisos();
      alert(permiso==="denied"
        ?"Has bloqueado los avisos. Para activarlos: Ajustes del móvil → Notificaciones → Casa."
        :"Sin permiso no se pueden mandar avisos.");
      return;
    }
    const reg=await swListo();
    const {clave}=await api("/api/push/clave");
    // Una suscripción anterior puede ser de otras claves: se rehace siempre.
    const vieja=await reg.pushManager.getSubscription();
    if(vieja){
      await api("/api/push/baja",{method:"POST",body:{endpoint:vieja.endpoint}}).catch(()=>{});
      await vieja.unsubscribe().catch(()=>{});
    }
    const sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:base64UrlABytes(clave)});
    await api("/api/push/suscribir",{method:"POST",body:{suscripcion:sub.toJSON(),idioma:IDIOMA}});
    try{ localStorage.setItem(AVISOS_CERRADO_KEY,"1"); }catch(e){}
    await comprobarAvisos();
    await probarAvisos(true);
  }catch(e){
    if(e.status!==401) alert("No se pudieron activar los avisos. Inténtalo de nuevo.");
    comprobarAvisos();
  }
}
async function desactivarAvisos(){
  const sub=await suscripcionActual();
  if(sub){
    await api("/api/push/baja",{method:"POST",body:{endpoint:sub.endpoint}}).catch(()=>{});
    await sub.unsubscribe().catch(()=>{});
  }
  comprobarAvisos();
}
async function probarAvisos(silencioso){
  const sub=await suscripcionActual();
  if(!sub){ if(!silencioso) alert("Este móvil no tiene los avisos activados."); return; }
  try{ await api("/api/push/prueba",{method:"POST",body:{endpoint:sub.endpoint}}); }
  catch(e){ if(!silencioso && e.status!==401) alert("No se pudo mandar el aviso de prueba."); }
}
// Al abrir un perfil: si este móvil ya recibe avisos, que pasen a ser los del
// perfil abierto. Sin preguntar nada: solo se actualiza a quién van.
async function sincronizarAvisos(){
  if(window.__DEMO__ || !soportaAvisos() || Notification.permission!=="granted") return comprobarAvisos();
  const sub=await suscripcionActual();
  if(sub) await api("/api/push/suscribir",{method:"POST",body:{suscripcion:sub.toJSON(),idioma:IDIOMA}}).catch(()=>{});
  comprobarAvisos();
}

const TEXTO_INSTALAR="Para recibir avisos en el iPhone, primero añade Casa a la pantalla de inicio: "+
  "en Safari, botón Compartir → «Añadir a pantalla de inicio». Después ábrela desde ese icono y activa los avisos.";

function bloqueAvisos(){
  const txt=(t)=>`<p class="dim" style="font-size:13px;margin:0">${t}</p>`;
  switch(_avisos){
    case "demo": return txt("En la demo no hay avisos.");
    case "instalar": return txt(esc(TEXTO_INSTALAR));
    case "no-soportado": return txt("Este navegador no admite avisos.");
    case "denegado": return txt("Los avisos están bloqueados en este dispositivo. Actívalos en Ajustes → Notificaciones → Casa.");
    case "activos": return `<div class="row" style="flex-wrap:wrap;gap:8px">
        <span class="pill p-ok">✓ Avisos activados aquí</span><span class="spacer"></span>
        <button class="btn sm" onclick="probarAvisos()">Probar</button>
        <button class="btn ghost sm" onclick="desactivarAvisos()">Desactivar</button></div>`;
    case "inactivos": return `<button class="btn primary w" onclick="activarAvisos()">🔔 Activar avisos</button>`;
    default: return txt("Comprobando…");
  }
}

// Tarjeta en el inicio de cada hijo hasta que active los avisos o la cierre.
// Es lo que más ayuda a que la app se use: un recordatorio a su hora.
function tarjetaAvisos(){
  if(!["inactivos","instalar"].includes(_avisos)) return "";
  try{ if(localStorage.getItem(AVISOS_CERRADO_KEY)) return ""; }catch(e){}
  return `<div class="mcard" style="border-color:#ffd9b8;background:linear-gradient(160deg,#fff,#fff6ec)">
    <b style="font-size:15px">🔔 Que no se te olvide nada</b>
    <p class="dim" style="font-size:13px;margin:6px 0 12px">${_avisos==="instalar"
      ?esc(TEXTO_INSTALAR)
      :"Activa los avisos y te recordamos por la tarde lo que te toca. También te enteras al momento cuando te aprueban algo."}</p>
    <div class="row" style="gap:8px">
      ${_avisos==="inactivos"?`<button class="btn primary sm" style="flex:1" onclick="activarAvisos()">Activar avisos</button>`:""}
      <button class="btn ghost sm" onclick="cerrarTarjetaAvisos()">Ahora no</button></div>
  </div>`;
}
function cerrarTarjetaAvisos(){ try{ localStorage.setItem(AVISOS_CERRADO_KEY,"1"); }catch(e){} render(); }

// Pantalla de selección. Cuatro botones grandes y nada que rellenar.
function mostrarSelector(aviso){

    <div class="pick-sep">Los hijos</div>

async function elegirPerfil(id){
  if(!esPerfilValido(id)) return;
  // Se llama desde la hoja de "cambiar de perfil": hay que cerrarla, o la
  // pantalla nueva aparecería con la anterior encima.
  closeSheet(); closeModal();
  recordarPerfil(id);
  // Cada persona tiene su propia pestaña abierta: al cambiar de perfil se
  // vuelve al inicio en lugar de heredar la sección del anterior.
  try{ localStorage.removeItem(TAB_KEY); }catch(e){}
  await abrirPerfil(id);
}

// Cambiar de perfil = volver al selector. Un solo gesto, sin confirmaciones.
function cambiarDePerfil(){
  closeSheet(); closeModal();
  mostrarSelector();
}

// `estado` es opcional: el arranque ya lo trae al comprobar el código de casa
// y no hace falta pedirlo dos veces.
async function abrirPerfil(id, estado){
  try{
    S = estado || await api("/api/state");
    showConn(true);
    ensureShape();
    marcarBase();          // punto de partida para detectar mis propios cambios
    restaurarPestanas();
    // La vista sale del perfil: los papás al panel de escritorio, los hijos a
    // su pantalla de móvil.
    S.profile = id;
    S.view = esHijo(id) ? "mob" : "desk";
    $("picker").style.display = "none";
    $("modebar").style.display = "";
    render();
    startPolling();
    sincronizarAvisos();
    if(!esHijo(id)) cargarInfoCasa(true);
  }catch(e){
    if(e.status===401) return;     // ya se está pidiendo el código de casa
    showFatal("No se pudo cargar la casa. Comprueba la conexión y vuelve a intentarlo.");
  }
}

function showFatal(msg){
  clearInterval(_poll);
  $("desk").style.display="none";
  $("mob").style.display="none";
  $("modebar").style.display="none";
  $("picker").style.display="block";
  $("picker").innerHTML=
    '<div class="pick-shell"><div class="pick-card">'+
    '<div class="pick-brand"><span class="dot">🏠</span><div><h1>Casa</h1>'+
    '<div class="sub">Algo no ha ido bien</div></div></div>'+
    '<div class="pick-err">'+esc(msg)+'</div>'+
    '<button class="btn primary w" onclick="location.reload()">Reintentar</button>'+
    '<button class="btn ghost w" style="margin-top:10px" onclick="mostrarSelector()">Elegir otro perfil</button>'+
    '</div></div>';
}

// Sondeo cada 4 s (solo cuando la app está activa)
let _poll=null;
function startPolling(){
  clearInterval(_poll);
  _poll=setInterval(async()=>{
    if(Date.now()-_lastSent<1500) return;
    // no repintar por debajo de alguien que está rellenando un campo
    const foco=document.activeElement;
    if(foco && /^(INPUT|SELECT|TEXTAREA)$/.test(foco.tagName)) return;
    // ni con una hoja o un diálogo abiertos
    if($("sheet").classList.contains("open") || $("modalBg").classList.contains("open")) return;
    try{
      const remote = await api("/api/state");
      showConn(true);
      // preserva lo que es de este dispositivo; adopta el resto si cambió
      const local={view:S.view,profile:S.profile,deskTab:S.deskTab,mobTab:S.mobTab};
      if(JSON.stringify(stripLocal(remote))!==JSON.stringify(stripLocal(S))){
        S=remote; Object.assign(S,local);
        ensureShape();
        marcarBase();        // lo que acabo de adoptar pasa a ser mi punto de partida
        render({quiet:true}); // sincronización de fondo: sin animación de entrada
      }else{
        // Aunque el contenido sea igual, la versión puede haber avanzado.
        S._version=remote._version;
      }
    }catch(e){
      // 401: el código de casa ha cambiado o ya no vale. api() ya ha parado el
      // sondeo y está pidiendo el nuevo; no es "sin conexión".
      if(e.status!==401) showConn(false);
    }
  },4000);
}
// Campos que son de ESTE dispositivo y por tanto no cuentan como "ha cambiado
// algo en la casa". Sin esto, cambiar de pestaña en un móvil repintaría la
// pantalla de todos los demás y les movería la sección abierta.
// _version también se ignora: que suba el contador no es "ha cambiado algo",
// y si contara provocaría un repintado en cada vuelta del sondeo.
function stripLocal(o){ const c={...o}; delete c.view; delete c.profile; delete c.deskTab; delete c.mobTab; delete c._version; return c; }

// ---------------------------------------------------------------------------
//  Modo demo (/demo)
//  Carga demo.js, que sustituye api() por un servidor falso en memoria. Sirve
//  para enseñar la app sin tocar los datos de casa: en modo demo NO sale ni
//  una petición al servidor. Hay que cargarlo ANTES de bootstrap(), porque si
//  no la app ya habría llamado a la API de verdad.
// ---------------------------------------------------------------------------
function esModoDemo(){
  return location.pathname === "/demo" ||
         location.pathname === "/demo/" ||
         (location.hash||"").replace(/^#\/?/,"").split("?")[0] === "demo";
}
if (esModoDemo()) {
  const _sDemo = document.createElement("script");
  _sDemo.src = "/demo.js";
  _sDemo.onload = () => bootstrap();
  _sDemo.onerror = () => showFatal("No se pudo cargar la demo.");
  document.head.appendChild(_sDemo);
} else {
  bootstrap();
}

// Si la app ya estaba abierta y se toca el enlace con el código, el navegador
// solo cambia lo que va detrás de "#" y no recarga: sin esto, el código no se
// guardaría hasta la próxima vez que se abriera la app.
window.addEventListener("hashchange",()=>{
  if(leerCodigoDeEnlace(location.hash)) bootstrap();
});

// Service worker: hace la app instalable (requisito de Google Play para poder
// publicarla como TWA) y que abra al instante. Nunca cachea /api/ — ver sw.js.
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("/sw.js").catch(()=>{ /* sin SW la app funciona igual */ });
  });
}

</script>
</body>
</html>
